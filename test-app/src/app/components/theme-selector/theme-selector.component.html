<div class="theme-selector">
  <h2>Выберите тему теста</h2>
  
  <div class="selector-wrapper">
    <p-dropdown
      [options]="themes"
      [(ngModel)]="selectedTheme"
      optionLabel="name"
      placeholder="Выберите тему"
      [disabled]="loading"
      [style]="{width: '100%'}">
    </p-dropdown>

    <div class="buttons-container">
      <p-button
        label="Начать тест"
        (click)="startTest()"
        [disabled]="!selectedTheme || loading"
        [loading]="loading">
      </p-button>
      
      <p-button 
        label="История тестов" 
        icon="pi pi-history"
        (click)="router.navigate(['/history'])"
        styleClass="p-button-secondary history-button">
      </p-button>
    </div>
  </div>
</div>
