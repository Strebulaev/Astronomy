sections:
  - title: "Основы астрономии и история"
    subsections:
      - name: "Ранние представления о Вселенной"
        topics:
          - name: "Геоцентрическая система Птолемея (II век н.э.)"
            details:
              - "Эпициклы и деференты"
              - "Альмагест - основной труд античной астрономии"
          - name: "Гелиоцентрическая система Коперника (1543 г.)"
            details:
              - "De Revolutionibus Orbium Coelestium"
              - "Подтверждение Галилеем (фазы Венеры, спутники Юпитера)"
        experiments:
          - "Опыт Эратосфена (измерение Земли)"
          - "Наблюдения Тихо Браге → законы Кеплера"
        resources:
          - "Учебник: 'Астрономия: век XXI' (Сурдин)"
          - "Фильм: 'История телескопа' (BBC)"

      - name: "Развитие небесной механики"
        topics:
          - name: "Законы Кеплера (1609-1619)"
            details:
              - "1. Эллиптические орбиты"
              - "2. Равновеликие площади"
              - "3. Гармонический закон"
          - name: "Ньютоновская революция (1687)"
            details:
              - "Закон всемирного тяготения"
              - "Вывод законов Кеплера из динамики"

      - name: "Инструменты астрономии"
        timeline:
          - period: "От Галилея до XIX века"
            instruments:
              - "Рефракторы vs рефлекторы (Галилей, Ньютон, Гершель)"
          - period: "XX-XXI век"
            instruments:
              - "Радиотелескопы (открытие реликтового излучения, 1965)"
              - "Космические обсерватории (Хаббл, JWST)"

  - title: "Земля и Луна"
    subsections:
      - name: "Физика Земли"
        topics:
          - name: "Форма и размеры"
            details:
              - "Сжатие у полюсов (эллипсоид)"
              - "Современные измерения (спутниковая геодезия)"
          - name: "Движения"
            details:
              - "Прецессия (26 000 лет, Гиппарх)"
              - "Нутация (18.6 лет, открыта Брадлеем)"

      - name: "Луна"
        topics:
          - name: "Теории образования"
            details:
              - "Гипотеза гигантского столкновения (Theia, 4.5 млрд лет назад)"
              - "Альтернативы (захват, совместная аккреция)"
          - name: "Эволюция поверхности"
            details:
              - "Лунные моря (застывшая лава)"
              - "Кратеры (хронология по плотности)"
        missions:
          - "Лазерная локация (ретрорефлекторы Apollo)"
          - "Миссия 'LRO' (картирование Луны)"
        tasks:
          - "Расчёт углового размера Луны"
          - "Определение высоты гор по тени"

  - title: "Солнечная система"
    subsections:
      - name: "Формирование"
        theories:
          - name: "Теория Канта-Лапласа (1755-1796)"
            details: "Конденсация из протопланетного диска"
          - name: "Современные модели"
            details:
              - "Миграция планет (гипотеза Ниццы)"
              - "Поздняя тяжёлая бомбардировка (LHB, 4.1-3.8 млрд лет назад)"

      - name: "Планеты земной группы"
        table:
          columns: ["Планета", "Атмосфера", "Геология", "Магнитное поле"]
          rows:
            - ["Меркурий", "Нет", "Кратеры", "Слабое"]
            - ["Венера", "CO₂ (92 атм)", "Вулканы", "Нет"]
            - ["Земля", "N₂+O₂", "Тектоника", "Сильное"]
            - ["Марс", "CO₂ (0.006 атм)", "Олимп (27 км)", "Остаточное"]

      - name: "Газовые гиганты и их спутники"
        planets:
          - name: "Юпитер"
            features:
              - "Большое красное пятно (антициклон)"
              - "Галилеевы спутники (Ио – вулканы, Европа – океан)"
          - name: "Сатурн"
            features:
              - "Кольца (лед + пыль, щели – резонансы)"
              - "Титан (азотная атмосфера, метановые озёра)"
        missions:
          - "'Вояджер-2' (облёт всех гигантов)"
          - "'Юнона' (исследование Юпитера)"
        tasks:
          - "Расчёт скорости убегания для Марса"
          - "Определение периода вращения Юпитера по облакам"

  - title: "Солнце и звёзды"
    subsections:
      - name: "Физика Солнца"
        structure:
          layers:
            - "Ядро (термояд: pp-цикл, CNO-цикл)"
            - "Фотосфера (грануляция, пятна)"
        activity:
          - "11-летний цикл (магнитное поле)"
          - "Корональные выбросы массы"

      - name: "Эволюция звёзд"
        stages:
          - "Диаграмма Г–Р"
            details:
              - "Главная последовательность (90% жизни)"
              - "Красные гиганты → белые карлики (звёзды малой массы)"
              - "Сверхновые → нейтронные звёзды/чёрные дыры (массивные)"
          - "Переменные звёзды"
            types:
              - "Цефеиды (период–светимость, Левитт)"
              - "Сверхновые типа Ia (стандартные свечи)"
        experiments:
          - "Гелиосейсмология (изучение внутренней структуры)"
          - "LIGO (гравитационные волны от слияния нейтронных звёзд)"
        tasks:
          - "Расчёт светимости звезды по температуре и радиусу"
          - "Определение расстояния по цефеиде"

  - title: "Галактики и космология"
    subsections:
      - name: "Млечный Путь"
        structure:
          components:
            - "Балдж (старые звёзды)"
            - "Диск (спиральные рукава)"
            - "Гало (тёмная материя)"
          center: "Sgr A* (4 млн M☉)"

      - name: "Эволюция галактик"
        classification: "Хаббла"
        types:
          - "Эллиптические (E0–E7)"
          - "Спиральные (Sa–Sd)"
        interactions:
          - "Приливные хвосты (галактика Антенны)"
          - "Квазары (аккреция на СМЧД)"

      - name: "Космология"
        theories:
          - "Теория Большого взрыва"
            evidence:
              - "Реликтовое излучение (T = 2.725 K)"
              - "Первичный нуклеосинтез (H:He = 3:1)"
          - "Тёмная энергия"
            discovery: "Ускоренное расширение (Нобелевская премия 2011)"
        tasks:
          - "Расчёт возраста Вселенной по постоянной Хаббла"
          - "Определение массы галактики по кривой вращения"

  - title: "Практика и современные исследования"
    subsections:
      - name: "Решение задач"
        methods:
          - "Параллакс (1 пк = 3.26 св. года)"
          - "Закон Стефана–Больцмана (L = 4πR²σT⁴)"
        olympiad_topics:
          - "Затмения (сарос, 18 лет)"
          - "Оценка плотности чёрной дыры"

      - name: "Современные проекты"
        areas:
          - name: "Экзопланеты"
            missions:
              - "TESS (транзитный метод)"
              - "JWST (спектроскопия атмосфер)"
          - name: "Гравитационные волны"
            detectors:
              - "LIGO/Virgo (слияния ЧД)"
        resources:
          - "Сайт: astro-olymp.ru (архив задач)"
          - "Курс: 'Астрофизика' на Stepik (Сурдин)"