ную скорость Земли (30 км/с), а полет через Юпитер требует добавки
12 км/с к орбитальной скорости Земли. Можно достичь окрестностей
Солнца, используя лишь маневры у Венеры и Земли, но такой полет
потребует около десятка тесных сближений с этими планетами. Гравитационный маневр у Юпитера — единственное приемлемое средство достижения Плутона, Харона и других тел пояса Койпера, что и
продемонстрировал зонд «New Horizons» (NASA).
2.10. Малая тяга. Солнечный парус
До сих пор мы рассматривали импульсные перелеты. Даже гравитационный маневр можно считать импульсным. Но уже испытываются и скоро станут обычными так называемые двигатели малой тяги.
Тяга у них малая, но работать она может месяцы и годы. Начальный
участок траектории в этом случае представляет собой раскручивающуюся спираль. Двигатели малой тяги работают на иных принципах, чем обычные химические импульсные двигатели большой тяги. Например, в электрореактивных двигателях до огромных скоростей ускоряется пучок ионов. Поэтому такие двигатели очень экономичны. Для маневров на орбите они незаменимы. Однако с их помощью КА не может оторваться от Земли: реактивное ускорение много
меньше ускорения свободного падения g. Так что начальный участок
траектории, упоминающийся выше, — это первоначальная орбита, на
которую КА выводится классической ракетой-носителем.
К двигателям малой тяги можно отнести и солнечный парус.
Давление света в обычных условиях едва или вовсе не ощутимо. Но
если в космосе развернуть парус из тончайшей пленки площадью
в несколько тысяч квадратных метров, то этого хватит для создания
малой, но длительной тяги. Запаса топлива как для корабельного,
так и для космического паруса не требуется. Солнечный парус пока
лишь испытывается: только недавно были созданы легкие, прочные
и непрозрачные пленки. Обратите внимание: пленка должна быть
непрозрачной (лучше — зеркальной), иначе свет ее «не заметит» и
никакого давления не окажет. Полеты под солнечными парусами —
дело ближайшего будущего. Где же они наиболее эффективны?
Сила солнечного излучения ослабевает обратно пропорционально квадрату расстояния от Солнца. В окрестностях Марса она в два
раза слабее, чем у Земли, в окрестностях Юпитера — в 30 раз слабее,
Нептуна — в 900 раз. Поэтому солнечный парус разумно применять
для маневрирования на околоземных орбитах и для полетов к Марсу
2.11. Движение в атмосфере 51
и во внутренние области Солнечной системы: к Венере, Меркурию,
Солнцу. При полете к Солнцу надо еще добиться, чтобы парус не сгорел и не расплавился. Те же обстоятельства определяют и эффективность солнечных батарей. За орбитой Марса они неэкономичны. Лететь к Юпитеру и дальше можно только с атомными источниками
электричества на борту.
2.11. Движение в атмосфере
При движении на высотах 200–1000 км ИСЗ медленно, но неуклонно
тормозится сопротивлением верхних слоев атмосферы. Спутник движется в окружающей среде со скоростью порядка 8 км/с. По сравнению с ней собственная скорость атмосферы мала. Сопротивление можно считать направленным прямо против вектора скорости
ИСЗ. Ориентация орбиты в этом случае сохраняется, но размеры и
форма меняются существенно. Плотность воздуха падает с высотой
очень быстро. Падает с высотой и скорость ИСЗ. Поэтому для низкоперигейного ИСЗ, эксцентриситет орбиты которого не исчезающе
мал — хотя бы больше 0,01 — основное торможение осуществляется в окрестности перигея. Из-за этого на каждом витке значительно уменьшается высота апогея, и лишь ненамного — высота перигея.
Орбита становится все ближе и ближе к круговой. Далее торможение равномерно распределяется по траектории, и спутник начинает
плавное снижение по спирали. Парадоксально, но скорость его при
этом увеличивается!
Дело тут в следующем. Торможение в атмосфере приводит к
уменьшению механической энергии спутника. Последняя складывается из кинетической и потенциальной (гравитационной). Снижаясь,
ИСЗ теряет потенциальную энергию. Расчеты показывают, что, несмотря на потерю механической энергии, кинетическая энергия возрастает. Так происходит вплоть до входа в плотные слои атмосферы
(для Земли — ниже 150 км). Там уже сопротивление воздуха становится сравнимым с притяжением. В результате — перегрузки, обгорание и падение скорости. Мелкие спутники сгорают, не долетая до
земли. Крупные спутники и последние ступени ракет-носителей обгорают, разваливаются, а их обломки падают на Землю со скоростями в десятки метров в секунду. И лишь самые крупные долетают до
поверхности планеты с существенно бльшими скоростями. Таковы,
скажем, орбитальные станции «Скайлэб», «Салют», «Мир». Когда кончается ресурс такой станции, ее спуск специально регулируют, что-
52 Глава 2. Небесная механика
бы упала она в ненаселенной местности или в океан. К сожалению,
это не всегда удавалось. «Скайлэб» и «Салют-7» разбились не совсем
так, как планировалось в центрах управления. К счастью, катастроф
все же не произошло.
До сих пор мы рассматривали атмосферу лишь как причину торможения ИСЗ. Вспомним о самолетах — воздух может быть и источником подъемной силы. Это качество давно уже используется в космонавтике. При спуске пилотируемые космические корабли благодаря небольшой подъемной силе сейчас сравнительно долго проходят верхние слои атмосферы, что значительно уменьшает перегрузки. Иногда используется эффект отражения от атмосферы. Это явление напоминает пускание «блинчиков» на воде, когда брошенный полого плоский камень многократно отражается от водной глади.
Сопротивление атмосферы и подъемную силу можно комбинировать с гравитационным маневром: например, проникнув сначала
в верхние слои атмосферы Венеры для последующего достижения
околосолнечного пространства или для того, чтобы погасить гиперболическую планетоцентрическую скорость и стать спутником планеты. Такие маневры уже использовались для перевода американских зондов на околомарсианскую орбиту (к сожалению, не всегда
удачно).
2.11.1. Парад планет
Довольно регулярно, раз в десяток лет, желтые издания публикуют
мрачные прогнозы профессиональных и полупрофессиональных запугивателей населения о парадах планет. Две последние шумихи
приходятся на 1978 и 1999 гг. Термин означает такую конфигурацию
планет, когда все они находятся на одном луче, исходящем от Солнца.
Разберем здесь два вопроса: как часто случаются парады и возможны ли они вообще; что они несут нам. Начнем с последнего.
Пресса действует по шаблону египетских жрецов с небольшими
модификациями: вместо затмения — парад планет, вместо запугивания во время явления — его предсказание и обещания разнообразных бедствий. Предположим, парад планет действительно состоялся. Как это отразится на Земле? Это было бы чудное зрелище! Простым глазом вы увидите ночью Марс, Юпитер и Сатурн рядышком
друг с другом. В небольшой телескоп к ним добавятся Уран и Нептун.
А днем в телескоп вы увидите то, что еще никто никогда не наблюдал: черная капля Венеры ползет по диску Солнца, потом ее обгоня-
2.11. Движение в атмосфере 53
ет меньшая столь же черная капля Меркурия. Словом, днем и ночью
красота неописуемая. А будет ли заметно физическое воздействие
планетной конфигурации на Землю? В том-то и дело, что нет. Разберем по порядку возможные механизмы влияния.
А) Гравитация: приливы на Земле. Мы знаем, что влияние гравитации на явления, происходящие на поверхности Земли, осуществляется приливными силами. Примем приливное ускорение от Луны
в подлунной точке, когда Луна находится на среднем расстоянии от
Земли, за единицу. Соответственно лунное приливное ускорение в
моменты прохождения Луной перигея и апогея будет 1,15 и 0,85. Наибольшее приливное ускорение от Венеры, когда последняя находится в нижнем соединении, равно 10−4; от Юпитера, когда последний в
противостоянии, — 10−5. От остальных планет оно в десятки, сотни и
тысячи раз меньше.
Таким образом, влияние планет ничтожно и тонет каплей не
только в море лунных и солнечных приливов, но даже в их вариациях от недели к неделе. Но давайте забудем о лунных и солнечных
приливах, будто их и нет вовсе. Даже тогда парад планет не внесет
практически ничего. Ведь он добавляет всего несколько процентов к
приливу от Венеры в нижнем соединении, а такое событие случается чаще, чем раз в два года!
Б) Гравитация: приливы на Солнце. Планеты вызывают приливы
и на Солнце, что якобы может вызвать нежелательные землянам изменения. Эти приливы на Солнце столь же ничтожны, что и на Земле.
По-прежнему главный прилив — от Венеры, затем — от Юпитера, а от
остальных планет не будет и процента. По-прежнему парад планет
не вызовет ничего, даже если забыть о малости воздействия. Приливы от Венеры и Юпитера будут складываться каждые 4 месяца (в моменты, когда для жителя Венеры Юпитер находится в соединении
или противостоянии), добавка же от парада практически нулевая.
В) Электромагнетизм. Земля имеет сильное магнитное поле,
мощные радиационные пояса заряженных частиц. Влияние планет
на электромагнитные поля Земли ничтожно. Еще меньше электромагнитное влияние планет на Солнце.
А был ли парад планет? Разумеется, парада не было ни разу за
всю историю Солнечной системы и не будет никогда. Ведь плоскости планетных орбит не совпадают. Для парада нужно, чтобы нашелся такой момент t0, в который все плоскости планетных орбит пересекались бы по одной прямой (общей линии узлов). Вдобавок и сами
54 Глава 2. Небесная механика
планеты должны оказаться на этой прямой, да еще с одной стороны.
История орбит в Солнечной системе прослежена на миллиарды лет
вперед и назад, и такого момента в ней нет.
Но давайте ослабим требования к параду, разрешив планетам собираться не только на луче, но внутри конуса с вершиной в центре
Солнца. Угол раствора конуса выберем в 20 градусов. Хотя какой же
это парад, когда планеты бродят чуть не по целому созвездию? Мы
проследили за положением планет на миллион лет вперед и назад и
убедились, что даже такого ослабленного парада не было и не будет.
Жаль, очень было бы красиво! Впрочем, собрание не всех, а трех-пяти
планет в одном созвездии происходят не так уж редко, и вы, наверное,
уже видели это (газеты всегда сообщают об этом событии заранее).
2.12. Эволюция планетной системы
Если предположить, что планеты притягиваются только Солнцем и
не оказывают воздействия друг на друга, то они описывают кеплеровские эллипсы. Каждая планета с некоторым периодом T возвращается на прежнее место. Периоды у планет различны, и общего для
всех периода не существует. Так что движение планетной системы
не является периодическим с точки зрения математики. Напомню,
что в математике явление называется T-периодическим, если по прошествии времени T система возвращается в прежнее состояние. Но
в природе лишь исключительно простые процессы могут быть такими, например колебания маятника.
Рассмотрим более сложную систему: смена времен года. Скажем,
1 июля в одном и том же месте в разные годы погода бывает разной,
и можно говорить лишь о приблизительной периодичности. Но точные науки не терпят приблизительных терминов. Изобретено понятие квазипериодичности для явления, раскладывающегося на сумму периодических (создателем теории квазипериодических функций
был рижский профессор П. Г. Боль).
Невозмущенное движение планет квазипериодично. В сумму
скольких периодических процессов оно раскладывается? Вопрос кажется тривиальным — конечно, n, если через n обозначить число
планет. Это так, но нельзя ли уменьшить число процессов до n0<n?
Оказывается, иногда можно. Рассмотрим два процесса с периодами
T1 и T2. Пусть T1/T2=p1/p2, где p1, p2 — целые взаимно простые числа. Тогда оба процесса имеют общий период T=p2T1=p1T2. Например, если две планеты имеют периоды обращения T1 и T2, то по про-
2.12. Эволюция планетной системы 55
шествии времени T первая планета совершит p2 оборотов, вторая —
p1 оборотов, и обе окажутся на прежнем месте. В таком случае говорят о резонансе, точнее, о резонансе p1 :p2 в движении планет. Если
же таких целых чисел p1, p2 не существует, то говорят об отсутствии
резонанса в системе.
Итак, при отсутствии резонанса в системе из n планет имеется n независимых периодов, в случае резонанса число последних n0
меньше n.
Маленькое пояснение. Сформулированное определение резонанса прекрасно с математической точки зрения, но не годится в естественных науках. Ведь речь идет о рациональности или иррациональности числа η=T1/T2. Только в модельных задачах периоды известны точно и определение имеет смысл. В реальности T1, T2 измеряются с некоторой погрешностью. Сколь бы мала она ни была,
различить рациональный и иррациональный случай невозможно
в принципе. На практике важно, можно ли представить число η в виде отношения двух небольших целых чисел p1 :p2 плюс малая поправка, или нельзя. Если можно, то по прошествии небольшого времени T система практически вернется в прежнее положение. Например,
пусть η=2/3+10−4π. По истечении времени T=3T1 первый процесс
вернется в прежнее положение, а фаза второго сместится всего на
тысячную долю окружности, т. е. на треть градуса. Резонанс налицо.
Если нельзя, то система вернется в близкое положение очень нескоро. Пусть, например, η = 1597/987 (подходящая дробь для «золотого»
числа (1+√5)/2). Система вернется в прежнее положение только через огромное время 987T1 = 1597T2. Резонанса нет.
Оказывается, наша Солнечная система устроена так, что массивные тела (восемь больших планет от Меркурия до Нептуна) не
резонируют друг с другом. Если перевести колебания планет (а по
каждой из координатных осей они колеблются!) в звуковые, то мы
услышим не «музыку сфер», а что-то вроде какофонии в оркестре к
концу антракта, когда каждый музыкант независимо от других настраивает свой инструмент. Напротив, среди малых тел много резонирующих с большими и друг с другом. Таковы десятки спутников,
тысячи малых планет и даже Плутон (напомню, что его масса в 6 раз
меньше лунной). Пока он делает два оборота вокруг Солнца, Нептун
успевает обежать его ровно три раза.
Примем теперь во внимание взаимное притяжение небесных
тел. Масса самой большой планеты, Юпитера, в тысячу с небольшим
56 Глава 2. Небесная механика
раз меньше солнечной. Примерно во столько же раз ускорение каждой планеты, вызванное притяжением других планет, меньше ускорения к Солнцу. Дифференциальное уравнение движения можно записать в форме
w = F0 + µF1. (10)
Здесь индексом 0 отмечено основное ускорение, индексом 1 — вызванное притяженем планет друг к другу возмущающее ускорение;
малый параметр µ~0,001. Уравнений типа (10) надо написать несколько, по числу планет. Движение при µ=0 нам известно. При
истинном малом значении µ траектория чуть-чуть отклоняется от
невозмущенной. Допустимо считать, что орбита по-прежнему является эллипсом, но его элементы (большая полуось, эксцентриситет и
т. д.) медленно меняются со временем со скоростью порядка µ. Этот
прием мы уже рассматривали на примере ИСЗ.
Фундаментальный вопрос: накапливаются ли возмущения со
временем или колеблются около некоторого среднего значения?
В первом случае мы говорим о вековых возмущениях; за время T0µ
орбиты менялись бы до неузнаваемости. Здесь T0 — характерный период, 10 лет для Солнечной системы, примерно год Юпитера. Критическое время T0µ равно всего 10 000 лет, совсем немного в истории
Земли. К нашему счастью, при отсутствии резонансов возмущения
большой полуоси, эксцентриситета и наклона не накапливаются, эти
важнейшие для жизни на Земле элементы лишь колеблются в узких
пределах.
Надо сказать, что к этому результату математики и астрономы шли три столетия. Очень уж трудно доказать эту теорему, ведь
уравнения (10) настолько сложны, что до сих пор не найдено в аналитическом виде их общего решения, пригодного на космогонических временах порядка T0/µ3. Ньютон полагал, что возмущения накапливаются. В образах того времени Великий Часовщик создал часы не абсолютного совершенства, нуждающиеся в ремонте раз в несколько десятков тысяч лет. Лаплас и Лагранж продлили устойчивость движения планет до миллионов лет. В свое время это вызвало бурный энтузиазм в образованных кругах, результат Лапласа—
Лагранжа назвали теоремой об устойчивости Солнечной системы.
Забавно, что теорема эта приятна и теистам (Часовщик создал часы высочайшего совершенства), и атеистам (Часовщик не нужен, по
Пушкину — «и без него все шло своим порядком»). Во второй половине ХХ в. советские математики А. Н. Колмогоров, В. И. Арнольд
2.12. Эволюция планетной системы 57
и независимо их американский коллега Ю. Мозер продлили время
устойчивости до миллиардов лет. Их результаты уточняются и сейчас, но главное уже сделано.
Любопытно, что факт устойчивости по крайней мере земной орбиты давно известен геологам и палеонтологам. С человеческой точки зрения климат Земли сильно менялся с геологическими эпохами. Но, во всяком случае, океаны никогда не покрывались сплошным
льдом и никогда не нагревались выше 40 °C. В первом случае океаны
бы никогда не растаяли, так как бело-голубая Земля отражала бы почти все падающее на нее излучение Солнца обратно в космос. Некому было бы читать эту книгу, да и написать ее. Во втором случае мы
бы наблюдали грандиозные вымирания растительного и животного
мира, по сравнению с которыми гибель динозавров показалась бы
мелкой неприятностью. Следовательно, в прошлом Земля получала
от Солнца примерно столько же энергии, сколько она получает сейчас. Последние 3 млрд лет Солнце обладает почти постоянной светимостью. Значит, большая полуось и эксцентриситет земной орбиты
существенно не менялись.
Стоит обратить внимание на слова примерно и почти. Колебания эксцентриситета амплитудой в 0,03–0,04 имеют место; ими согласно хорошо аргументированной гипотезе югославского ученого
М. Миланковича объясняются ледниковые периоды в плейстоцене.
Итак, орбиты восьми больших планет около 4 млрд лет назад
приняли современный вид и с тех пор оставались примерно такими
же. А Плутон? Мы помним о его резонансе с Нептуном. Оказывается, в
резонансном случае эволюция сильно зависит от фазы. Орбиты Плутона и Нептуна близки к пересечению, расстояние между ними менее 2 а. е. При сближении Плутон перешел бы на существенно другую
орбиту, а после серии сближений упал бы на Нептун или на Солнце
либо был бы выброшен за пределы Солнечной системы. Но фазы «подобраны» так, что в точках сближения орбит планеты никогда не бывают вместе, расстояние между ними всегда больше 18 а. е. Доказано,
что такое состояние длится многие миллиарды лет, орбита Плутона
устойчива и сохраняет резонансность с Нептуном. Желающие могут
связать это с мудростью Часовщика, нежелающие — с естественным
отбором. Начиная с 1992 г. открыты уже сотни планеток диаметрами
порядка сотен километров, двигающиеся по схожим с плутоновой орбитам. Они устойчивы, поэтому мы их и видим. Множество же тел, попавших на неустойчивые орбиты, исчезло так, как описано чуть выше.
58 Глава 2. Небесная механика
2.13. Эволюция спутниковых систем
Часто пишут, что спутниковые системы больших планет — это планетные системы в миниатюре. Это не совсем так с точки зрения не
только физики (планета не греет свои спутники), но и механики.
Спутники малы, и главные возмущения в их движении вызваны сжатием центральной планеты и притяжением Солнца. К тому же резонансность встречается там часто. Например, периоды обращения
трех галилеевых спутников Юпитера — Ио, Европы и Ганимеда — связаны соотношением
1
T1
