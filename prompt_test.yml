2.9. Гравитационный маневр
Сфера влияния планеты очень мала, но проникновение в нее может
дать значительный эффект. КА попадает туда всегда с гиперболической скоростью — ведь он приходит из «бесконечности», имея там уже
немалую скорость. Траектория относительно планеты в сфере влияния представляет собой небольшой кусок гиперболы. Для инопланетного зрителя результатом почти мгновенного прокола сферы влияния явится поворот вектора скорости на угол α между асимптотами
(рис. 2.8), но в системе Коперника с центром в Солнце к скоростям относительно планеты нужно еще прибавить гелиоцентрическую скорость самой планеты — в результате скорость КА изменится и по направлению, и по величине. Мы можем не только развернуть КА по нашей воле, но еще и увеличить (а если нужно, и уменьшить) его скорость. Энергия здесь черпается (или отдается) из кинетической энергии обращения планеты вокруг дневного светила. Поскольку масса
КА неизмеримо меньше массы планеты, изменение энергии планеты
не ощутимо никакими самыми точными приборами.
Чем теснее подходит частица к притягивающему центру, тем
меньше угол α между асимптотами отличается от 180° и тем эффективнее гравитационный маневр. Но мы не можем подлететь к центру
планеты ближе, чем на ее радиус (с учетом атмосферы). А чем массивнее планета, тем больше ее размер. Поэтому на первый взгляд трудно сказать, какие планеты лучше подходят для гравитационного маневра. Поскольку же масса растет пропорционально кубу радиуса, вывод однозначен: чем массивнее планета, тем бльшие возможности
предоставляет она для маневрирования. Маломассивные Меркурий
и Марс не в состоянии сколько-нибудь существенно изменить орбиту
КА. Венера и Земля уже способны на это. Однако для значительного
изменения орбиты потребуется несколько сближений с этими планетами, причем сближения можно чередовать в любой последовательности: например, три раза подряд подойти к Венере и затем два раза — к Земле. Мощный преобразователь орбит — Юпитер: достаточно однократного прохождения вблизи него, чтобы покинуть Солнечную систему или упасть на Солнце. Для маневра можно использовать
и гравитационное поле Луны: для переходов внутри системы Земля—
Луна и для выхода из этой системы в межпланетное пространство.
Первый в мире гравитационный маневр был совершен в 1959 г.
зондом «Луна-3». В результате искусного использования гравитационного поля Луны (несмотря на его малость!) «Луна-3», стартовав-
2.9. Гравитационный маневр 49
шая с северного полушария Земли, облетев наш естественный спутник, вернулась снова в Северное полушарие, что тогда казалось неслыханным чудом. Так в СССР были получены первые фотографии
обратной стороны Луны.
Сейчас гравитационное маневрирование стало обычным. Именно таким образом американский зонд «Вояджер-2» после пролета
Юпитера достиг Сатурна, а затем Урана и Нептуна (рис. 2.19). Советские «Вега-1 и -2» встретились с кометой Галлея после гравитационного маневра в поле Венеры. Зонд «International Cometary Explorer»
(NASA/ESA) встретился с кометой Джакобини—Циннера после сложных маневров в системе Земля—Луна. Множественные маневры в поле Земли и Венеры совершили «Галилео» и «Кассини». Международный зонд «Улисс», предназначенный для исследования полярных областей Солнца, смог высоко подняться над плоскостью эклиптики
только за счет гравитационного маневра в поле Юпитера.
В будущем, возможно, предпримут запуск зонда в солнечную
корону. Для прямого падения на Солнце нужно погасить орбитальРис. 2.19. Траектории полетов космических аппаратов «Вояджер-1» и «Вояджер-2». Цифры вдоль орбит указывают месяц и год (двадцатого века), а при
встрече с планетами — день, месяц и год. (The Cambridge atlas of astronomy, J. Aodouse and G. Israel editors, Cambridge Univ. Press, Cam. — L. — N. Y., 1985. P. 48.)
