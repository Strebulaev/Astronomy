полем гравитационной потенциальной
энергии Ep единицы массы Q. Оба поля
однозначно определяют друг друга. Вовторых, представим поле в виде ряда,
т. е. суммы бесконечного числа слагаемых:
Ep = V0 + V1 + V2 + … (7)
Здесь начальное слагаемое описывает притяжение шара с центром
в центре масс T и нам уже известно из формулы (4): V0=−K2/r. В отличие от силы, потенциал шара убывает обратно пропорционально первой степени расстояния от центра масс T. Следующие слагаемые Vs убывают обратно пропорционально r s+1, причем V1=0. Если Q
далеко, то достаточно взять несколько первых членов (7) или даже
только начальный член, чтобы получить удовлетворительную точность. Иными словами, гравитационное поле любого тела с удалением от него все больше напоминает поле шара, в полном соответствии с наблюдением древних софистов, что издали и квадратная башня кажется круглой. Для близких Q (например, если T — Земля, Q —
