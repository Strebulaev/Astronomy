2.6. Движение ИСЗ
Как рассчитывают трассы небесных тел в сложных гравитационных
полях? Простых формул, подобных выведенным Кеплером и Ньютоном для описания движения частицы вокруг шара, для сложных полей не существует. Более того, за редчайшими исключениями вообще не существует абсолютно точных формул. Это следствие реальной сложности движений. Какими же средствами располагает современная наука? В самых общих чертах их можно разделить на две
группы.
1. Аналитические методы. С их помощью сложное движение
можно представить как наложение бесконечного числа простых движений. До предела упрощенный пример — знакомая по школьным
2.6. Движение ИСЗ 37
учебникам формула суммы бесконечного числа членов геометрической прогрессии:
1
x
 = 1 + (1−x) + (1−x)2 + (1−x)3 + … (9)
Предположим, что марсиане умееют складывать, вычитать и умножать числа, представленные десятичными дробями, и знают, что
есть и обратное умножению действие — деление, но делить не научились. Так вот, левую часть (9) марсиане смогут вычислить, складывая большое количество чисел из правой части, а каждое из них получается умножением (1−x) самого на себя. Уже на этом простейшем
примере видны две особенности аналитического подхода.
Во-первых, для получения точного ответа нужно проделать бесконечно много операций, что невозможно. Но для достижения заданной точности нужно произвести уже конечное число операций.
Последнее тем больше, чем выше требования к точности. Пусть, например, x=1,1. Чтобы ошибка (9) составила не больше 0,01, следует
взять два слагаемых справа; четыре слагаемых гарантируют погрешность менее 0,0001.
Во-вторых, формулы аналитического метода работают не для
одного какого-то набора значений переменных величин, а для любых их значений из некоторой области. Так, равенство (9) можно
применять не только при x=1,1, а для всех значений x от 0 до 2. Но
для x=−1,5 формула (9) не годится, и приходится прибегать к другим соотношениям. Например, для −2<x<0 можно применить формулу 1/x =−[1+(1+x)+(1+x)2+(1+x)3+…]. В небесной механике орбиты разного типа также описываются разным набором аналитических формул.
2. Численные методы представляют собой вычисление положения и скорости частицы в последовательные моменты, разделенные
небольшими промежетками времени, по соответствующим значениям этих величин и действующих сил в предшествующие моменты.
Такой путь прост и универсален. Большое количество вычислений
в век электроники — недостаток не самый важный. Хуже, что получается лишь одна траектория и даже для соседней все вычисления
приходится выполнять с самого начала.
 На практике нередко комбинируют аналитический и численный
методы, что привело к впечатляющим успехам в описании движения
планет, их спутников, комет, астероидов. Но мы нарушим историче-
38 Глава 2. Небесная механика
ский порядок и обратимся сначала к искусственным небесным телам. ИСЗ ближе к нам и двигаются сравнительно просто. Естественно переходить от простого к сложному.
Свой виток вокруг планеты спутник проходит почти точно по эллипсу, но виток не замыкается. Следующий оборот будет отличаться от предыдущего примерно на 1/300, так как настолько притяжение Земли вблизи ее поверхности отличается от притяжения шара. За
300 оборотов (примерно месяц для близких ИСЗ) орбита может измениться до неузнаваемости. Меняется не всё. Истинное движение мало
(в пределах 10 км) отклоняется от движения по некоторому опорному
эллипсу. Опорный эллипс имеет фиксированные размер, форму и наклон к плоскости экватора, но вращается вокруг двух осей одновременно. Во-первых, линия апсид (соединяющая перигей и апогей) по-
 Рис. 2.13. Орбита типичного ИСЗ. Для наглядности расстояния
между соседними витками увеличены.
2.6. Движение ИСЗ 39
ворачивается в плоскости эллипса с угловой скоростью ω1. Во-вторых,
сама эта плоскость поворачивается вокруг полярной оси с угловой
скоростью ω2. В терминах небесной механики перицентр испытывает
вековое возмущение со скоростью ω1, а восходящий узел орбиты на
экваторе — вековое возмущение со скоростью ω2. В результате траектория типичного ИСЗ приобретает вид запутанного клубка, изображенного на рис. 2.13. Описанные свойства надо учитывать при проектировании, чтобы спутник с успехом выполнял свою работу.
Возьмем для примера ИСЗ «Молния». Его основное назначение —
осуществлять связь между западом и востоком России и СНГ. Следовательно, орбита должна быть достаточно высокой, чтобы сверху была видна значительная часть территории. Связь подчиняется суточ-
 Рис. 2.14. Орбита ИСЗ типа «Молния». Для наглядности расстояния
между соседними витками увеличены
40 Глава 2. Небесная механика
ному ритму (скажем, телепередача «Время» транслируется в одно и то
же время в каждой зоне вещания), так что период ИСЗ обязан укладываться в сутках целое число раз. С учетом предыдущего условия
получаем для периода одно из трех значений: 6, 8, 12 часов (особый
случай 24 часа надо рассматривать отдельно). Наклон i плоскости орбиты к экватору должен лежать в пределах 40÷80° для покрытия широтной зоны, в которой расположено СНГ. Эксцентриситет следует
взять близким к единице и направить апогей в Северное полушарие,
тогда спутник будет почти все время в рабочей зоне, быстро пролетая
Южное полушарие (вспомните о скоростях в разных точках эллипса).
В результате отпадают периоды в 6 и 8 часов, так как для них эксцентриситет нельзя сделать большим, ведь внутри эллипса должна еще
поместиться Земля с ее атмосферой. Остается период в 12 часов.
Пока мы ограничивались рамками задачи одного притягивающего центра. Но «Молния» рассчитана на долгие годы работы, и выбранная орбита должна быть устойчивой на многих тысячах витков.
Поэтому необходим учет несферичности Земли, что ставит под сомнение весь проект. Вращение линии апсид с угловой скоростью ω1
через 180°/ω1 суток (если ω1 измерять в градусах за сутки) повернет
апогей в Южное полушарие, и наша «Молния» станет обслуживать
Австралию. Однако величина ω1, как показывают расчеты, содержит
множитель (4−5 sin2i) и обращается в нуль при i=63,4°. Такой наклон
нас вполне устраивает. Реальные «Молнии» двигаются по орбитам с
наклоном, близким к указанному. Орбита «Молнии» (рис. 2.14) отличается от изображенной на рис. 2.13 тем, что все апогейные точки
располагаются на окружности, имеющей широту около 63°.
По рис. 2.14 может показаться, что из-за вращения плоскости
орбиты вокруг полярной оси территория России постепенно будет
уплывать из-под орбиты «Молнии». Это, конечно, не так. На рисунке,
в отличие от кино, не изобразить вращения планеты. Земля делает
один оборот в то время, за которое спутник делает два оборота. Из
двух витков «Молнии» лишь один — рабочий. Поэтому (хотя не только поэтому) надо иметь несколько таких спутников.
Обратимся к 24-часовым спутникам. Этот вариант активно используется в системах спутниковой связи многих стран — но только
в круговом экваториальном варианте e≈0, i≈0. Для земного наблюдателя спутник на небе кажется неподвижным, «висящим» над одной
и той же точкой земной поверхности, поэтому его называют геостационарным. Влияние несферичности Земли, а также притяжение Лу-
2.7. Пассивное движение в системе Земля—Луна 41
ны и Солнца медленно уводит ИСЗ от «точки стояния», в результате
чего приходится время от времени корректировать его орбиту.
Для спутников «Молния» выбраны орбиты, на которых ω1=0. Активно используются в космонавтике и орбиты, на которых ω2=0. Это
полярные орбиты (i=90°), единственные, где спутник может быть виден в зените на полюсах.
Еще более интересен пример широко применяемых траекторий,
для которых ω2=0,986°/сут. Именно с такой угловой скоростью Земля обращается вокруг Солнца. Поэтому рассматриваемые орбиты называются солнечно-синхронными. Линия Солнце—Земля составляет
с плоскостью орбиты постоянный угол, в частности, может совпадать
с ней, вследствие чего спутник пролетает над каждым районом земной поверхности почти в одно и то же местное солнечное время. Это
весьма удобно при сравнении фотоснимков, полученных в разные
дни спутниками, исследующими Землю.
2.7. Пассивное движение в системе Земля—Луна
Пусть спутник Земли поднят так высоко, что может сближаться с Луной. В результате наложения земной и лунной гравитации разнообразие орбит становится поистине фантастическим. Никто пока не
сумел перечислить все их типы. Рассмотрим один интересный класс
замкнутых периодических орбит. Для простоты будем считать лунную орбиту окружностью.
Сначала надо ввести геоцентрическую систему отсчета, вращающуюся вместе с Луной. В этой системе Луна неподвижна, неподвижен и центр Земли, а сама Земля вращается с периодом в 24 ч 50 мин.
Этот период легко определит каждый из вас. В ясную лунную ночь отметьте положение тени какого-либо неподвижного предмета и засеките время. В следующую ясную ночь тень будет на том же месте через 24 ч 50 мин. Введенная система отсчета кажется несколько искусственной. Но это не совсем справедливо. Такая система естественна
для селенитов (воображаемых жителей Луны и будущих обитателей
лунных баз). В их небе Солнце всходит и заходит, а Земля висит неподвижно, показывая одни и те же города каждые 24 ч 50 мин. Здесь
можно напомнить о том, что период вращения Земли вокруг оси равен 23 ч 56 мин. Это звездные сутки. Для земного наблюдателя через
это время каждая звезда возвращается на прежнее место, например,
точно на небесный меридиан. Относительно Солнца период вращения Земли равен 24 ч. Это солнечные сутки. Наконец, относительно
42 Глава 2. Небесная механика
Луны — 24 ч 50 мин. Этот период можно бы назвать лунными
сутками Земли. Именно с таким
периодом повторяются условия
передач земных радиостанций
для селенитов.
Периодические орбиты —
это траектории, замыкающиеся в нашей вращающейся вместе с Луной системе отсчета после истечения некоторого периода T. Простейшими периодическими орбитами будут положения равновесия, ведь точечную
траекторию можно считать периодической при произвольном периоде T. Как показали Л. Эйлер и
Ж. Лагранж, в нашей системе существует ровно пять положений равновесия, так называемых точек либрации L1–L5. Три из них, найденные Эйлером, лежат на прямой Земля—Луна. Одна из них, находящаяся между Землей и Луной точка либрации L1, представляет и практический интерес: в будущем ее предполагается использовать как
место перевалочной базы при освоении Луны. Точки либрации L1, L2,
L3 неустойчивы, поэтому время от времени необходима незначительная коррекция космического аппарата (КА), находящегося в окрестности L1, во избежание его ухода от L1 на неприемлемое расстояние.
 Не исключено и создание базы в одной из открытых Лагранжем
точек L4, L5, лежащих в плоскости лунной орбиты и образующих вместе с Землей и Луной два равносторонних треугольника. Это тем заманчивее, что L4 и L5 оказались устойчивыми, в отличие от L1, L2, L3.
Неучтенное притяжение Солнца все же может вывести КА из
приемлемой окрестности L4 или L5. Так что коррекция орбиты может
понадобиться и здесь, но гораздо реже.
Вокруг каждой из точек L1—L5 существуют и «настоящие» периодические орбиты. Траектории вокруг лежащей дальше Луны точки L2,
похожие на овал в плоскости, перпендикулярной прямой Земля—Луна, получили особое наименование гало-орбит. В будущем они сыграют важную роль в освоении Луны. На гало-орбитах разместятся
спутники-ретрансляторы, позволяющие поддерживать радиосвязь
между Землей и базой, расположенной на обратной стороне Луны.
Рис. 2.15. Точки Лагранжа в системе
Земля—Луна. Предполагается, что орбита Луны круговая.
2.7. Пассивное движение в системе Земля—Луна 43
На рис. 2.16 изображена более замысловатая периодическая орбита, показывающая их богатое разнообразие. КА на такой орбите
попеременно является то спутником Земли, то спутником Луны.
Задача о движении КА в гравитациононном поле Земли и Солнца математически тождественна задаче о движении в поле Земли и
Луны. Тут тоже существуют периодические орбиты и точки либрации. Более того, они уже используются на практике. Космический
аппарат SOHO для исследования процессов на Солнце находится всё
время на гало-орбите вблизи точки L1.
Решения задачи о движении объекта в окрестности двух массивных тел оказывается очень полезным, и не только в приложении
к Солнечной системе: они используются и при изучении движения
вещества в двойных звездных системах, и в звездных скоплениях, и
в системах галактик. Но нужно помнить, что все эти полезные решения получены при определенных предположениях. Например, точки
Лагранжа существуют в рамках ограниченной задачи: два тела имеют конечные массы (любые; обе массы могут быть даже равны друг
другу), а третья бесконечно мала (у нас это космический аппарат). Но
при этом не всегда движение в треуголных точках Лагранжа L4, L5 будет устойчивым.
Рис. 2.16. Одна из множества периодических орбит частицы
в поле тяготения Земли и Луны в геоцентрической системе отсчета, вращающейся вместе с Луной.
