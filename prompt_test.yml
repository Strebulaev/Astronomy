ностей. Если 1<ρ≤11,9, то полуэллипс остается оптимальной траекторией. Если ρ≥15,6, то более экономичен трехимпульсный перелет,
осуществляемый по схеме типа Петербург—Одесса через Владивосток (рис. 2.18). В точке A1 дается разгонный импульс v1, больший, чем
нужно для выхода на эллипс Гомана—Цандера, но меньший, чем нужно для ухода на бесконечность. В результате получим полуэллипс
A1A2, заходящий за орбиту цели. В его апоцентре A2 снова прикладывается разгонный импульс v2, обеспечивающий полет по полуэллипсу A2A3, касательному к орбите цели. В точке A3 дается уже тормозной импульс v3, переводящий космический аппарат на круговую орбиту. И что удивительно: чем дальше расположена точка A2, тем меньше характеристическая скорость v1+v2+v3. А оптимального перелета
нет! Он существует лишь как некая абстракция: надо уйти в «бесконечность», приложить там «нулевой» импульс и вернуться в точку A3.
Если 11,9<ρ<15,6, то трехимпульсный переход по-прежнему
экономичнее двухимпульсного, но только для достаточно удаленного расположения точки A2. Если запретить далеко отрываться от родной Земли, то перелет Гомана—Цандера может все же оказаться оптимальным.
Перелеты Штернфельда — еще и средство изменения плоскости
орбиты. Если точка A2 расположена очень далеко, то импульс скорости v2 там очень мал. Его можно направить в любую сторону, затрачивая дополнительно совсем мало топлива, и получить орбиту желаемого наклона.
Покинем теперь околоземное пространство и устремимся к другим планетам. Как ни удивительно, ничего нового изобретать не придется. Достаточно в наших рассуждениях заменить Землю Солнцем,
орбиту старта — орбитой Земли и орбиту финиша — орбитой плаРис. 2.18. Траектория перелета
Штернфельда; показаны точки
приложения As (s=1, 2, 3) и векторы vs импульсов скорости для
перелета с низкой орбиты на высокую.
2.8. Импульсные перелеты 47
неты-цели. Правда, около самих планет надо учитывать их притяжение. Но зона, в которой это притяжение существенно (так называемая сфера влияния планеты), очень мала по сравнению с межпланетными расстояниями.
Как применяется описанная теория в космонавтике? Почти каждая траектория перелета КА на околоземных орбитах или полет к
Луне, Венере, Марсу представляет собой сокращенный эллипс Гомана—Цандера. Слово «сокращенный» означает, что радиус-вектор, соединяющий центральное тело и КА, поворачивается на угол, несколько меньший 180°, так что траектория КА близка к оптимальной, но
отличается от нее, причем почти всегда в одну сторону. Объясняется это тем, что мы учитывали до сих пор лишь один фактор — расход
топлива. Но время перелета также играет не последнюю роль. Чем
оно короче, тем лучше: меньше нужно запасать энергии для работы приборов, меньше вероятность выхода приборов из строя. А уж
для пилотируемых полетов роль времени не нуждается в пояснении.
Далее требуется уменьшить чувствительность к неизбежным неточностям при выведении на орбиту. А эллипс Гомана—Цандера к ним
очень чуток: немного недобрал скорость — и уже недолет. Все это и
заставляет сокращать переходную орбиту.
А где же перелеты Штернфельда? В межпланетных полетах они
вряд ли будут применяться. Они выгоднее двухимпульсных лишь для
достижения Урана, Нептуна, Плутона — и Солнца. Но и прямой-то полет к внешним планетам требует десятков лет, а уж трехимпульсный
перелет с вылетом из Солнечной системы займет сотни и тысячи лет.
Недопустимо затянется и полет к Солнцу. Но не надо отчаиваться —
мы расскажем о других путях достижения этой цели.
Радиус лунной орбиты содержит 60 радиусов Земли, так что ρ
значительно превышает предел 15,6. Полет к Луне через залунные
области даст экономию около 8% топлива. Пока такая схема перелета не применялась: ведь время в пути — несколько месяцев вместо нескольких дней прямого полета. Но не исключено, что при освоении Луны для товарных ракетных поездов будет использоваться
именно траектория Штернфельда. Сегодня же по подобным траекториям часто выводят на орбиту 24-часовые ИСЗ: это оптимальный
способ получить высокую орбиту нулевого наклона при запуске с
космодрома с широтой, превышающей 40°. Отметим очередной космический парадокс: легче вывести КА на орбиту Луны, чем на орбиту 24-часового ИСЗ, в 9 раз более близкую.
