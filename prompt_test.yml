2.8. Импульсные перелеты
Итак, у нас в запасе внушительный набор орбит, по которым можно
двигаться долго-долго, не затрачивая ни малейших усилий. Но как
попасть туда? Будем считать, что мы уже вышли в космос на круговую орбиту искусственного спутника Земли, а теперь нам надо перейти на более высокую орбиту, тоже круговую и лежащую в той же
плоскости. Имея суперракету, можно перелететь с орбиты на орбиту множеством способов, но современные ракеты пока не позволяют
развивать скорости в сотни километров в секунду, так что не все способы реализуемы. А поскольку каждый лишний грамм груза на борту — все равно что кирпич в рюкзаке у туриста, из возможных способов следует выбрать оптимальный, т. е. требующий минимального
количества топлива.
Реактивные двигатели работают без перерыва несколько минут,
тогда как перелеты длятся часы, а межпланетные — месяцы и годы.
Так что можно считать без большой ошибки, что космический корабль практически мгновенно получает добавку скорости (как говорят, к аппарату прикладывается импульс скорости). Чтобы уйти с орбиты старта, нужен по крайней мере один импульс v1. Чтобы остаться на орбите финиша — еще один v2. Так называемая характеристическая скорость v1+v2, а с ней и расход топлива, будут минимальными, если импульсы прикладывать по касательным (рис. 2.17). Это было доказано еще в 1920-е годы В. Гоманом в Германии и Ф. А. Цандером у нас.
2.8. Импульсные перелеты 45
В космосе все движения обратимы. Точнее, если все скорости
всех тел изменить на противоположные, то они будут двигаться по
тем же орбитам, но в противоположную сторону. В частности, если
все стрелки на рис. 2.17 перевернуть, то получим тоже допустимые
движения. Это значит, что оптимальный перелет с высокой на низкую орбиту — тот же эллипс Гомана—Цандера с теми же импульсами v2 и v1, но на этот раз не разгонными, а тормозными, в результате чего в дальнейшем можно ограничиться перелетами на более высокие орбиты.
Отнюдь не всегда начальная и конечная орбиты лежат в одной
плоскости. Существенное изменение плоскости орбиты — задача, непосильная для современных ракет (опять космический парадокс: автомобилю трудно забираться на гору, но ничего не стоит свернуть
направо). Действительно, чтобы повернуть плоскость орбиты на 60°,
по правилу векторного сложения скоростей требуется импульс, равный скорости движения КА, т. е. 8 км/с для низких спутников Земли.
Но задача о стыковке двух ИСЗ решается и для совсем разных
орбитальных плоскостей, лишь бы совпадали их наклоны к экватору. Действительно, плоскости орбит близкого и далекого ИСЗ из-за
влияния сжатия Земли вращаются вокруг полярной оси и притом с
разными угловыми скоростями. Достаточно выждать неделю-другую,
пока плоскости орбит не совпадут, тогда и надо включать двигатели
по описанной схеме.
Вернемся к задаче перелета между компланарными круговыми
орбитами. А что если не ограничиваться двумя импульсами? Как показал в 1930-е годы А. А. Штернфельд (родившийся в Польше, работавший сначала во Франции, затем в СССР), решение в этом случае зависит от отношения ρ радиусов внешней и внутренней окружРис.  2.17. Полуэллипс Гомана—Цандера;
показаны точки приложения As (s=1, 2) и
векторы vs импульсов скорости для перелета с низкой орбиты на высокую.
