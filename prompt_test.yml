2.2. До Ньютона
Какие научные истины о форме и движении блуждающих светил
были твердо установлены учеными античности (ограничимся Грецией, эллинистическим Египтом и Римом, где наука не была эзотерической, тайной, а была доступна любознательным свободным гражданам). Кстати, ученые той эпохи очень удивились бы постановке такого вопроса, никак не связывая между собой форму и движение планет. Но теперь мы знаем, что и то, и другое определяется гравитацией и посему ставим вопросы рядом.
1. Земля имеет форму шара. В тысячах книг вы прочтете десятки доказательств этого. Например: в море горизонт кажется круглым,
где бы ни находился ваш корабль. Действительно, только шар обладает таким свойством. Находись мы на огурце, расстояние до горизонта было бы различно в разных направлениях. Но с какой точностью нам известна округлость горизонта? С очень небольшой. Только
астрономические наблюдения подтверждали шарообразность Земли с высокой точностью. Например, если вы равномерно идете точно
на юг, Полярная звезда (точнее, полюс мира) равномерно опускается
к горизонту, исчезает на экваторе, и вы видите равномерно подымающийся южный полюс мира. Первое определение размеров земного шара выполнил в III в. до н. э. александрийский ученый Эратосфен.
2. Античные ученые утверждали, что Солнце и Луна — шары. Что
касается Луны, то тут были веские основания. На Луне нормальным
невооруженным глазом видно много деталей, подчеркнем — неизменных. Поэтому ясно, что Луна обращена к нам одной стороной. Но
принадлежит эта сторона плоскому диску или шару, без телескопа
не различить. Однако форма линии терминатора убедительно показывает, что к нам обращено полушарие (рис. 2.1 и 2.2). Зато слепящий
диск Солнца (последний термин употребляется в астрономии до сих
пор) никак не выдает своей выпуклой формы.
2.2. До Ньютона 17
Итак, древние на самом деле не знали форму Солнца. Почему же
они так возлюбили шар и убедили себя в шарообразности светил?
Во-первых, по аналогии с Землей и Луной. Но главная причина — религиозные и философские (то есть идеологические) догмы. Небо совершенно, небесные тела совершенны, совершенна форма их поверхности, что по пифагорейским представлениям равносильно сферичности. Редчайший в науке случай, когда предвзятая, не имеющая ни
малейшей естественнонаучной опоры догма приводит к правильному ответу. Теперь сферичность Земли и других ближних небесных
тел не нуждается в доказательствах: достаточно взглянуть на снятые
из космоса фотографии и кинофильмы. Научный интерес представляют лишь малые отклонения от сферической формы.
3. Солнце относительно звезд для земного наблюдателя движется по большому кругу небесной сферы, получившему странное
имя эклиптика, что приблизительно означает круг затмений. Дело в том, что лунные затмения происходят как раз тогда, когда Луна в полнолуние попадает на эклиптику. Солнечные затмения тоже происходят на эклиптике, когда Луна попадает туда в новолуние и закрывает от нас Солнце. Но это тривиально: Солнце по определению всегда находится на эклиптике. Все же назвать солнечный
путь эклиптикой — то же самое, что шоссе назвать «путем автокатастроф».
Рис. 2.1. Вид Луны в полнолуние (слева) и в новолуние вполне согласуется с гипотезой о диске, но все остальные фазы Луны, например первую четверть (справа),
можно объяснить только в том случае, если Луна — шар.
18 Глава 2. Небесная механика
Движение Солнца неравномерно: зимой в северном полушарии
оно движется быстрее, летом — медленнее. Движение Луны сложнее.
Чтобы описать его, астрономы изобрели могущественнейший прием,
играющий в механике важнейшую роль и сегодня: разложение сложного движения на совокупность простых. Именно, Луна описывает
большой круг, наклоненный к плоскости эклиптики примерно на 5°.
Но сама эта плоскость вращается вокруг оси эклиптики по часовой
стрелке (если смотреть с севера), делая полный оборот за 18,6 лет.
Как и Солнце, по своему кругу Луна тоже движется неравномерно,
вдобавок точка ее наибольшей скорости (перигей) движется против
часовой стрелки, делая полный оборот за 9,6 лет.
Знали астрономы и более тонкие детали в движениях Солнца и
Луны по небу, что позволяло им с удивлявшей современников точностью предсказывать солнечные и лунные затмения.
4. Пути планет по небу чертят столь замысловатый клубок
(рис. 2.3), что поражает воображение, как древние смогли распутать
его и построить не превзойденный полторы тысячи лет шедевр — теоРис. 2.2. Наблюдения Луны даже невооруженным глазом убеждают нас, что
1) Луна — шар (видимые фазы Луны показаны в рамках); 2) Луна обращается вокруг Земли (ее угловой размер почти неизменен); 3) Луна не светит
сама, а отражает солнечный свет; 4) периоды вращения Луны вокруг оси и
обращения вокруг Земли совпадают (неизменен рисунок на диске).
