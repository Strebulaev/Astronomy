Коэффициент пропорциональности G называют постоянной тяготения или гравитационной постоянной.
Какой контраст с прошлым! Вместо непонятно откуда взятых
нагромождений кругов — простая, коротенькая и кристально ясная
формула. Все сложные движения небесных тел, и не только в крошечной Солнечной системе, а во всей Вселенной, предстали математическими следствиями соотношения (1)! С точки зрения математики запись (1) приводит к дифференциальным уравнениям движения
небесных тел. По определению, дифференциальные уравнения механики представляют собой закон, по которому положениям и скоростям всех небесных тел ставятся в соответствие их ускорения. Скорость v любого тела есть вектор, равный производной по времени от
вектора положения r. Вектор ускорения w есть скорость изменения
скорости, т. е. производная от скорости или, что то же, вторая производная от вектора положения. А сила и ускорение отличаются лишь
скалярным множителем — массой.
Мы не будем здесь составлять и решать дифференциальные
уравнения, дадим лишь пояснения. Дифференциальное уравнение
всегда имеет бесконечно много решений. Именно: фиксируем какой-либо момент времени; положения и скорости всех тел в этот
момент могут быть произвольными. Если их закрепить, то положения всех тел для любого времени t как в будущем, так и в прошлом определяются однозначно. В астрономии принято t0 называть
начальной эпохой (хотя ничего ни первоначального, ни эпохального
здесь нет), положения и скорости — состоянием системы, положения и скорости в начальную эпоху — начальными данными. Таким
образом, состояние системы однозначно определяется начальными
данными.
В качестве простейшего примера приведем движение по прямой
по инерции как решение дифференциального уравнения движения
частицы в бессиловом поле. Силы нет, ускорение равно нулю и уравнение тривиально:
