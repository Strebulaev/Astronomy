T3
 = 0.
Далее, спутники гораздо ближе к своим планетам, чем последние к Солнцу, не только в абсолютных, но и в относительных единицах. Луна считается далеким спутником, но до нее 60 земных радиусов, а от Земли до Солнца — 210 солнечных. А до Ио всего 6 радиусов
Юпитера, до Фобоса 3 радиуса Марса. Поэтому важную роль играют
приливные явления. Не будь их, спутниковые системы были бы столь
же стабильны, как планетные. Подчеркнем, что устойчивость орбит
обеспечивается малостью планетных масс по сравнению с солнечной, малостью спутниковых масс по сравнению с планетной, близостью спутников к планете по сравнению с расстоянием до Солнца, а
также малостью эксцентриситетов и наклонов.
Разительный пример важности последнего обстоятельства приведен советским специалистом по механике космического полета
М. Л. Лидовым. «Запустим» Луну на такую орбиту, которую она имеет сейчас, за одним исключением: пусть наклон ее орбиты к плоскости эклиптики будет близок к 90°. Оказывается, орбита будет необратимо вытягиваться при малом изменении размера, в конце концов
Луна упадет на Землю. И не за привычные в астрономии миллионы
и миллиарды лет, а всего за пять лет!
Вернем Луну на существующую орбиту и обратимся к приливам. На Земле лунный прилив вызывает колебания поверхности амплитудой в полметра. Земля вращается вокруг своей оси в 30 раз
быстрее, чем Луна вокруг Земли (сравниваются угловые скорости
или, что эквивалентно, периоды: сутки и месяц). Следовательно,
приливная волна катится с востока на запад, против вращения Земли и своим трением замедляет его. По закону сохранения вращательного момента в системе Земля—Луна вращательный момент ор-
2.13. Эволюция спутниковых систем 59
битального движения Луны увеличивается. В результате Земля вращается все медленнее; Луна отодвигается и тоже замедляет свой
бег по орбите и свою угловую скорость обращения в силу третьего
закона Кеплера. Приблизительно через 15 млрд лет сутки сравняются с месяцем и их продолжительность станет равной 55 нынешним
суткам. Земля и Луна, как танцоры в вальсе, будут смотреть друг на
друга одной стороной.
Будем теперь двигаться в прошлое. Чем дальше вглубь веков,
тем быстрее вращается Земля и Луна, тем короче сутки и месяц.
А всегда ли сутки на Луне были равны месяцу, т. е. Луна показывала
Земле лишь свое «лицо»? Конечно, нет! Вначале Луна вращалась быстро. Но на Луне земной прилив в 20 раз выше, чем на Земле лунный.
Это отношение неизменно, тогда как амплитуда приливов была много больше в прошлом, когда тела были ближе.
Ясно, что Луна быстро замедлила свое вращение и пришла в
устойчивое состояние, а Земле это еще предстоит. Не только Луна,
а многие спутники в Солнечной системе смотрят на свои планеты
одной стороной, но только одна пара — Плутон и Харон — уже пришла в конечное «вальсирующее» состояние. Эта пара вообще уже закончила свою приливную эволюцию и достигла стационарного состояния.
Итак, в результате приливной эволюции многие спутники сейчас
смотрят на свою планету одной стороной, и при этом многие отодвигаются от нее; в этом большинство спутников подобны Луне. Но некоторые спутники под действием приливов приближаются к своей планете. Во-первых, это спутники с обратным движением: Тритон у Нептуна, Феба у Сатурна и еще некоторые далекие спутники Юпитера
и Урана. Во-вторых, это очень близкие спутники с прямым движением, опережающие вращение планеты: Метида и Адрастея у Юпитера,
10 внутренних спутников Урана, 5 внутренних спутников Нептуна. Самый известный пример этого представляет собой пара Марс—Фобос.
Последний движется ближе и быстрее пока не выведенных на орбиту
стационарных искусственных спутников Марса. Приливной горб на
Марсе отстает. Фобос раскручивает Марс и с уменьшением собственного орбитального вращательного момента приближается к планете,
двигаясь все быстрее. Приблизительно через 30 млн лет Фобос упадет
на Марс, если мы не вмешаемся раньше.
В заключение — немного об изменении взглядов ученых на природу. Тысячи лет они задавались вопросом, откуда взялось движение
60 Глава 2. Небесная механика
и кто поддерживает вечный бег планет. После Ньютона стало ясно,
что движение неуничтожимо, и второй вопрос отпал, но над первым
мучились еще лет двести. Сейчас отпал и он (по крайней мере, если
не касаться причин Большого взрыва и работать с уже существующей материей в знакомых нам формах). Наоборот, астрономы пытаются ответить на противоположные вопросы типа почему спутники,
Меркурий, Венера, Солнце вращаются вокруг своих осей так медленно. Ответ о спутниках мы знаем. Скорее всего, аналогичная причина — солнечный прилив — замедлила вращение внутренних планет.
Медленность вращения Солнца связана с передачей его вращательного момента орбитальному моменту планет. Механизм же передачи
до конца еще не ясен.
2.14. Релятивистская небесная механика
Когда Ньютон опубликовал свой закон всемирного тяготения, современники тут же задали ему вопрос: а откуда взялось само тяготение? По моему мнению, это верх бестактности. Ньютон сделал бесконечно много. Объяснил тонкие особенности движения Луны, планет, их спутников, комет; окончательно стер грань между земным и
небесным, описав единым образом движение брошенного камня и
Луны; показал, как запустить ИСЗ и слетать на Луну: надо разогнать
аппарат до вычисленных им первой и второй космической скорости.
К счастью для сэра Исаака, ограниченные его современники не приставали к нему с вопросами, как достичь таких скоростей. Ньютон
объяснил близость формы небесных тел к шарообразной и их сжатие (а сжатие Земли он предсказал); объяснил падение давления и
плотности воздуха с высотой и отсутствие атмосферы на Луне; объяснил явление приливов в океане и предсказал прилив в твердой
Земле и воздухе. Я говорю лишь о связанных с гравитацией явлениях. А сколько он сделал в математике, механике, оптике, приборостроении, экономике! И после этого удивляться, почему Ньютон не
открыл еще причины гравитации и не подарил им заодно эликсир
бессмертия?
Через 230 лет история повторилась: А. Эйнштейн открыл причину тяготения, создав общую теорию относительности. Материя искривляет пространство-время, а мы воспринимаем это как гравитацию. Первое, о чем спросили Эйнштейна, — откуда взялось искривление. Лет через 50 (или раньше) искривление сведут к явлению X.
Разумеется, ученого сразу спросят, откуда взялось явление X.
2.14. Релятивистская небесная механика 61
Из общефилософских законов следует, что, как всякая созданная человеком модель, ОТО отражает действительность лишь приближенно. Однако в XX веке ни одного отклонения от ОТО (в области, где несущественны квантовые эффекты) в опыте не обнаружено,
несмотря на практически ежедневное тестирование ОТО. Это значит,
что ошибки теории меньше погрешностей приборов. Сегодня ОТО
можно считать абсолютно точной. Хотя, конечно, наступит день, когда мы узнаем пределы применимости ОТО и построим более совершенную теорию гравитации.
Формулы ОТО сложнее ньютоновских, но само явление описывается гораздо проще и нагляднее. Масса вызывает искривление пространства-времени, распространяющееся с конечной скоростью, со
скоростью света. Этим устраняется присущее ньютоновской теории немыслимое свойство мгновенного распространения тяготения.
В слабых гравитационных полях при медленных движениях формулы теории относительности переходят в формулы ньютоновской механики.
Какие скорости можно считать малыми? Оказывается, даже космические. Относительная погрешность законов Ньютона — величина
порядка µ=v2/c2, где v — скорость частицы, c — скорость света. Скорость Земли относительно Солнца v≈30 км/с, поэтому µ≈10−8. Скорость спутников еще меньше. Для самой быстрой планеты, Меркурия, v≈50 км/с и µ≈3·10−8.
А какое поле можно считать слабым? Достаточно определить,
до какой скорости может разогнаться свободно падающая частица.
Таким образом, интенсивность гравитационного поля можно оценить второй космической скоростью vII. Для Земли у ее поверхности
vII
≈11 км/с и µ≈10−9, что свидетельствует о крайней слабости притяжения Земли. (Конечно, лишь для применения ОТО. Свалившийся
даже со второго этажа человек вряд ли посчитает земное притяжение слабым.) Притяжение Солнца, естественно, значительнее. Но и у
орбиты Меркурия параболическая скорость для отрыва от Солнца
vII≈70 км/с, µ≈6 ·10−8. Даже у края Солнца vII ≈ 600 км/с, µ≈4 ·10−6.
Итак, в Солнечной системе релятивистские эффекты чрезвычайно малы. Их учитывают при построении максимально точных теорий движения планет, спутников, космических аппаратов. Так, погрешность ньютоновской теории движения планет земной группы за
10 лет составляет около 1000 км, а релятивистской — около 5 км. Но в
качественное описание движения никаких поправок вводить не надо.
62 Глава 2. Небесная механика
Иная ситуация в окрестности компактных массивных объектов.
Типичная нейтронная звезда, например, имеет массу, как у Солнца, и размер, как у Фобоса. У ее поверхности vII ≈130 Мм/с, поэтому
µ~0,2. Даже луч света сильно искривляется, проходя рядом с нейтронной звездой. В системе двух близких друг к другу нейтронных
звезд последние обращаются вокруг общего центра масс с субсветовыми скоростями. Это приводит к излучению гравитационных волн
и потере энергии. В конце концов звезды сталкиваются, происходит
взрыв чудовищной мощности, превышающей светимость галактик
на много порядков.
Что же до черной дыры, то там вообще творятся чудеса. Пролетающий мимо нее метеорит (не будем говорить о звездолете, чтобы не переживать за космонавтов) обогнул бы ее по гиперболе, будь
справедливы законы Ньютона. Но по законам ОТО метеорит при достаточно близком прохождении сделает несколько витков вокруг
черной дыры, прежде чем снова уйти на бесконечность. Если же он
проникнет под так называемый горизонт, то уже никогда не вернется обратно.
Тут надо внести уточнение. По нашим часам (часам внешнего
наблюдателя) он никогда не достигнет горизонта. Будет вечно туда
падать со все уменьшающейся скоростью. По своим же часам он упадет туда очень быстро! Конечно, на метеорите часов нет, и надо бы
говорить о собственном времени, но таковы странные традиции теории относительности.
2.15. Заключение
Мы рассказали, как возникла небесная механика, как она стала
современной наукой, какие задачи решала, где используется сейчас. Рассказ был далеко не полным. Мы опустили такие триумфы
небесной механики, как предсказание возвращения кометы Галлея
и открытие Нептуна, не сказали о службе движения тысяч малых
тел, мировой центр которой находится в Петербурге; о поиске возможных неоткрытых планет или даже тусклых карликовых звезд —
гипотетических спутников Солнца; об исследованиях двойных и
кратных звезд и планетных систем других солнц. Все это связано
не только с небесной механикой и частично описано в других разделах книги. В заключение укажем некоторые нерешенные задачи астрономии, в которых небесной механике принадлежит важная роль.
2.15. Заключение 63
• Определение изменения гравитационного поля, формы и вращения Земли со временем в связи с действием приливов, послеледниковым поднятием, дрейфом континентов, перераспределением ледниковых масс, антропогенной деятельностью.
• Определение масс и орбит внесолнечных планет по различным
наблюдениям.
• Определение происхождения планет.
• Определение долгосрочной эволюции ансамбля всех составляющих Солнечной системы.
Добавлю, что решенные в принципе задачи надо постоянно решать заново. Ведь решение типовой задачи дает нам алгоритм, который надо по-разному применять в конкретных ситуациях. Пример —
расчет траектории полета к Юпитеру или любому другому телу Солнечной системы. Тела двигаются, их расположение никогда не повторится, так что и орбиты перелета всегда новые."
