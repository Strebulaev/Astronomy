«Кайтесь! Молитесь Птаху, Хатор, Ра! Клянитесь трудиться, как
велит Моральный кодекс строителя пирамид! Не покладать рук от
восхода до заката! Жертвуйте Храму! Всё лучшее — богам и их детям! Клянитесь громче, и да услышат вас бессмертные боги!» Долгий
нечленораздельный, чередующийся с членораздельным, вой. Диск
Солнца увеличивается, затмение кончается. Народ ликует — конец
света отложен. Чаша «на воссоздание Храма Ра-Спасителя» быстро
наполняется.
Какие выводы сделаем мы из этой обычной истории?
1. Астрономия была достаточно развита в Древнем Египте. Примерно то же можно сказать и о древней Месопотамии, где также происходили подобные сценки.
2. В отличие от Китая астрономия, да и вся наука, в Древнем
Египте была не на государственной службе, а прозябала в храмах,
была важной частью занятий жрецов и только жрецов.
3. Астрономия целиком (а другие науки — частично) была эзотерической, т. е. тайной. Жрецы тщательно скрывали свои занятия
наукой, выдавая за общение с богами свои наблюдения светил, а за
записи воли богов — свои вычисления моментов затмений путем
решения алгебраических и тригонометрических уравнений (увы,
дифференциальных им боги не открыли). Если бы кто-то из жрецов
прочел бы публичную лекцию «Солнечные и лунные затмения, их
причины и следствия», он не дожил бы до следующего дня. Убийства за нарушение эзотеричности были в то время обычным явлением. Ведь трудно удержаться и не рассказать хоть кому-то тайну, которой владеешь. Теперь эзотеричность науки осталась только в ее
военной части. Желаю вам дожить до времени, когда она исчезнет
совсем. А если вы увидите или услышите о «докторе эзотерических
наук», отнеситесь к этому как к вредному, а не полезному ископаемому.
