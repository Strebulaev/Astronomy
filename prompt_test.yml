определенным моментом импульса. В точках бифуркации может произойти смена геометрического типа тела: небольшие возмущения могут перевести его на
другую последовательность фигур равновесия. Некоторые космические тела, например планеты, действительно можно считать жидкими, поскольку их плотность слабо меняется с глубиной, но для нормальных звезд это допущение не
подходит: плотность их вещества очень сильно меняется от центра к поверхности, поэтому для них рассчитана последовательность фигур сжимаемых тел
(фигуры Джинса).
