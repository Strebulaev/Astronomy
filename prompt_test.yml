Вернемся к Ньютону. Формула (1) была ясна ему (и не одному
ему) интуитивно, по аналогии со светом. Освещенность от точечного
источника в среде без поглощения ослабевает обратно пропорционально квадрату расстояния. С чего бы гравитации подчиняться другому закону? Но интуиция может подвести даже гения (таких случаев история знает сколько угодно). Главная заслуга Ньютона — доказательство закона тяготения. Ученый выбрал метод, похожий на доказательство от противного. Именно, он выводит проверяемые следствия (1) и убеждается, что все они согласуются с наблюдениями в пределах ошибки измерений. Если хоть раз натолкнуться на разительное противоречие, то закон тяготения надо похоронить. Если нет…
Математик скажет, что из последнего ничего не следует. «Противное»
может лишь опровергнуть ваше предположение, но не доказать его.
Но астрономия, физика, все естественные науки в корне отличны от
математики. Закон (1) проверялся тысячами ученых на миллионах
объектов во всех частях Вселенной в самых разных условиях и всегда выходил победителем. Так что истинность его установлена с наивысшей степенью надежности.
Тут самое время сделать существенную оговорку. Согласно любой из развитых философий, наши знания отражают действительность не точно, а с некоторой погрешностью. Прогресс науки заключается, в частности, в том, что эта погрешность усилиями ученых
уменьшается, но нулем ее сделать невозможно. Некоторые отклонения в движениях светил от ньютоновских правил все же были обнаружены, что в конце концов привело к созданию А. Эйнштейном более совершенной теории тяготения, включающей ньютоновскую в
предельном случае малых (по сравнению со скоростью света) скоростей и сравнительно слабых полей тяготения.
2.4. Движение в главном поле 25
Модель Эйнштейна получила странное имя — «Общая теория относительности»; о ней мы поговорим позже. А пока заметим, что в
подавляющем большинстве случаев релятивистскими (т. е. связанными с теорией относительности, общей или частной, от лат. relativus — относительный) можно пренебречь и считать ньютоновскую
теорию абсолютной истиной. Рассмотрим, по каким траекториям будут тогда двигаться небесные тела.
2.4. Движение в главном поле
Траектории небесных тел сложны и запутаны. Чтобы в них разобраться, поступим согласно канонам теории возмущений. Именно,
выделим главные силы, действующие на систему, и пренебрежем
всеми остальными. Полученную упрощенную систему назовем невозмущенной. Решим ее. А уже потом добавим другие, малые силы.
А малое воздействие — как принято говорить, малое возмущение —
учесть значительно легче (об этом позже).
Массы планет значительно меньше массы дневного светила.
Юпитер в тысячу раз легче Солнца, Сатурн в три раза легче Юпитера, Земля в сто раз легче Сатурна… Поэтому в первом приближении
можно считать, что на каждую из планет действует только притяжение Солнца.
Еще более идеализируем задачу, предполагая планету материальной частицей пренебрежимо малой массы. Но Солнце считать
«частицей» нельзя, оно имеет внушительные видимые размеры. Примем, что Солнце — идеальный шaр, плотность которого зависит лишь
от расстояния до его центра. Как доказал И. Ньютон, шар притягивает внешние частицы как материальная точка той же массы, помещенная в его центре. Мы пришли к модельной задаче одного притягивающего центра. Каковы траектории частицы в поле притяжения
массивной центральной точки S? Как показал Ньютон, возможны четыре типа орбит.
1. Луч или отрезок, лежащие на прямой L, проходящей через
центральное тело S. Этот случай имеет место, если начальная скорость направлена точно к S или точно в противоположную сторону.
Это свойство сохраняется во все время движения, что лишний раз
подчеркивает условность термина «начальная». Остальные три типа
орбит — плоские кривые, не содержащие прямолинейных участков.
2. Эллипс (рис. 2.6). Центральное тело S, как ни странно это звучит, находится не в центре эллипса, а в одном из двух его фокусов.
