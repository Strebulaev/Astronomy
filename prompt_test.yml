"Небесная механика
К. В. Холшевников
2.1. Начало
Наряду с астрометрией небесная механика — древнейшая ветвь
астрономии, существовавшая уже в третьем тысячелетии до н. э.
Основная двуединая задача небесной механики от античности до наших дней — построение математической модели движения небесных тел и определение ее параметров из наблюдений.
В этой статье я буду использовать современные термины. Но
для передачи аромата эпохи полезно иногда приводить и старые.
Любя высокопарный стиль, наши предшественники говорили не
«модель», а «Система Мира». Словосочетание небесная механика появилось и вошло в употребление лишь после публикации в 1798 г.
одноименного сочинения П. С. Лапласа. А как же говорили до этого? В древности — никак. Астрономия, и всё тут! Потом стали добавлять прилагательные и долго отождествляли теоретическую астрономию и небесную механику. Потом теоретические разделы появились и в других ветвях астрономии — прежде всего в астрофизике,
и сейчас термин «теоретическая астрономия» практически вышел из
употребления.
История небесной механики делится на два больших периода:
до и после выхода в 1686 г. книги И. Ньютона «Математические начала натуральной философии». С этого момента начинается наука в
современном смысле слова. Движение предстало однозначным следствием физических причин, тогда как раньше причины известны не
были и математические модели ничем не ограничивались, кроме как
недостатком фантазии ученых или идеологическими догмами, господствовавшими в обществе.
Многие мои друзья-астрофизики (рождение астрофизики как
современной науки произошло еще при жизни некоторых ныне
здравствующих долгожителей), говорят мне, что небесная механика как наука началась с Ньютона, а до этого была только преднаукой.
