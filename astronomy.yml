olympiads:
  - name: Всероссийская олимпиада школьников по астрономии
    link: https://vos.olimpiada.ru/
    calendar: https://vos.olimpiada.ru/calendar
    stages:
      - name: школьный этап
        tasks: https://tasks.olimpiada.ru/upload/files/tasks/75/2024/taskssol-astr-10-11-gr1-sch-sirius-24-25.pdf
        solutions: https://tasks.olimpiada.ru/upload/files/tasks/75/2024/taskssol-astr-10-11-gr1-sch-sirius-24-25.pdf
        history:
          2024:
            11:
              - input: "Определение конфигурации Венеры (наибольшая элонгация) и расчёт расстояний."
                solution: |
                  1. Определить положение Венеры при максимальной элонгации (угол 90° между Солнцем, Венерой и Землёй).
                  2. Использовать геометрические свойства орбит для расчёта расстояний.
                  3. Применить третий закон Кеплера для оценки изменений орбитальных параметров.
                verification: Проверить соответствие ответа теоретическим расчётам и данным астрономических справочников.
              - input: "Анализ фотографии планет на небе и определение полушария."
                solution: |
                  1. Определить направление восхода планет (влево/вправо) относительно горизонта.
                  2. Сравнить с ожидаемым поведением эклиптики в Южном полушарии.
                verification: Сравнить с известными астрономическими явлениями для Южного полушария.
              - input: "Расчёт скорости самолёта, наблюдающего восход Солнца каждые 6 часов."
                solution: |
                  1. Учесть скорость вращения Земли (0.463 км/с).
                  2. Рассчитать относительную скорость самолёта, используя время между восходами.
                verification: Проверить согласованность скорости с физическими ограничениями.
              - input: "Определение изменения синодического периода Венеры при увеличении радиуса орбиты."
                solution: |
                  1. Использовать формулу синодического периода: \( S = \frac{TT_0}{T_0 - T} \).
                  2. Учесть изменение орбитальных периодов по третьему закону Кеплера.
                verification: Проверить логику вывода и соответствие законам Кеплера.
      - name: муниципальный этап
        tasks: https://vos.olimpiada.ru/main/table/tasks/astr/
        solutions: https://vos.olimpiada.ru/main/table/answers/astr/
      - name: региональный этап
        tasks: https://vos.olimpiada.ru/main/table/tasks/astr/
        solutions: https://vos.olimpiada.ru/main/table/answers/astr/
      - name: заключительный этап
        tasks: https://vos.olimpiada.ru/main/table/tasks/astr/
        solutions: https://vos.olimpiada.ru/main/table/answers/astr/

  - name: Московская астрономическая олимпиада
    link: https://mosastro.olimpiada.ru/
    calendar: https://mosastro.olimpiada.ru/calendar
    tasks: https://mosastro.olimpiada.ru/archive/
    solutions: https://mosastro.olimpiada.ru/solutions/

  - name: Олимпиада "Ломоносов" по астрономии и космическим исследованиям
    link: https://olymp.msu.ru/
    calendar: https://olymp.msu.ru/calendar/
    tasks: https://olymp.msu.ru/archive/astronomy/
    solutions: https://olymp.msu.ru/solutions/astronomy/

  - name: Олимпиада "Физтех" по физике (включает астрономические задачи)
    link: https://olymp.mipt.ru/
    calendar: https://olymp.mipt.ru/calendar
    tasks: https://olymp.mipt.ru/archive/physics/
    solutions: https://olymp.mipt.ru/solutions/physics/
    astronomy_section: 
      tasks: https://olymp.mipt.ru/astronomy-tasks/

  - name: Олимпиада СПбГУ по астрономии
    link: https://olympiada.spbu.ru/
    calendar: https://olympiada.spbu.ru/calendar/
    tasks: https://olympiada.spbu.ru/archive/astronomy/
    solutions: https://olympiada.spbu.ru/solutions/astronomy/

  - name: Олимпиада "Высшая проба" по физике (включает астрономию)
    link: https://olymp.hse.ru/mmo/
    calendar: https://olymp.hse.ru/mmo/calendar
    tasks: https://olymp.hse.ru/mmo/archive/physics/
    astronomy_section:
      tasks: https://olymp.hse.ru/astronomy-tasks/

task_analysis_prompt: |
  При анализе олимпиадных задач выполнить:
  1. Определить точный источник (олимпиада, этап, год, класс)
  2. Классифицировать по типам
  3. Выявить темы:
  4. Извлечь ключевые формулы и методы решения
  5. Оценить сложность
  6. Найти аналогичные задачи
  7. Сгенерировать рекомендации по подготовке

olympiad_review_analysis_prompt_intro: |
  выполни задачу olympiad_review_analysis_prompt из файла astronomy.yml, используя файл обзора задач олимпиады

olympiad_review_analysis_prompt: |
  Задача:
    - Извлечь типы задач
    - Извлечь алгоритмы решения промежуточных и конечных задач
    - Обобщить подход к анализу подобных задач (определения типа, алгоритмов решения промежуточных и конечных задач за минимальное время с верификацией решения)
    - дополнить файл данными из обзора: добавить элементы .history.${year}.${grade}.${stage}.tasks, включая описание задачи и алгоритм ее решения, где year - год олимпиады (брать младший, если указан диапазон), grade - класс (брать старший, если указан диапазон), stage - этап. дать исходное описание задачи (.input), пошаговый алгоритм решения (.solution, использовать только примененный в обзоре), альтернативные решения (.alternate_solutions, если есть более оптимальные методы решения) и пошаговый алгоритм проверки решения (.verification)
  
  Формат вывода: финальный модифицированный файл astronomy.yml