olympiads:
  - name: Всероссийская олимпиада школьников по астрономии
    link: https://vos.olimpiada.ru/
    calendar: https://vos.olimpiada.ru/calendar
    stages:
      - name: школьный этап
        tasks: https://tasks.olimpiada.ru/upload/files/tasks/75/2024/taskssol-astr-10-11-gr1-sch-sirius-24-25.pdf
        solutions: https://tasks.olimpiada.ru/upload/files/tasks/75/2024/taskssol-astr-10-11-gr1-sch-sirius-24-25.pdf

      - name: муниципальный этап
        tasks: https://vos.olimpiada.ru/main/table/tasks/astr/
        solutions: https://vos.olimpiada.ru/main/table/answers/astr/

      - name: региональный этап
        tasks: https://vos.olimpiada.ru/main/table/tasks/astr/
        solutions: https://vos.olimpiada.ru/main/table/answers/astr/
      
      - name: заключительный этап
        tasks: https://vos.olimpiada.ru/main/table/tasks/astr/
        solutions: https://vos.olimpiada.ru/main/table/answers/astr/

  - name: Московская астрономическая олимпиада
    link: https://mosastro.olimpiada.ru/
    calendar: https://mosastro.olimpiada.ru/calendar
    tasks: https://mosastro.olimpiada.ru/archive/
    solutions: https://mosastro.olimpiada.ru/solutions/

  - name: Олимпиада "Ломоносов" по астрономии и космическим исследованиям
    link: https://olymp.msu.ru/
    calendar: https://olymp.msu.ru/calendar/
    tasks: https://olymp.msu.ru/archive/astronomy/
    solutions: https://olymp.msu.ru/solutions/astronomy/

  - name: Олимпиада "Физтех" по физике (включает астрономические задачи)
    link: https://olymp.mipt.ru/
    calendar: https://olymp.mipt.ru/calendar
    tasks: https://olymp.mipt.ru/archive/physics/
    solutions: https://olymp.mipt.ru/solutions/physics/
    astronomy_section: 
      tasks: https://olymp.mipt.ru/astronomy-tasks/

  - name: Олимпиада СПбГУ по астрономии
    link: https://olympiada.spbu.ru/
    calendar: https://olympiada.spbu.ru/calendar/
    tasks: https://olympiada.spbu.ru/archive/astronomy/
    solutions: https://olympiada.spbu.ru/solutions/astronomy/

  - name: Олимпиада "Высшая проба" по физике (включает астрономию)
    link: https://olymp.hse.ru/mmo/
    calendar: https://olymp.hse.ru/mmo/calendar
    tasks: https://olymp.hse.ru/mmo/archive/physics/
    astronomy_section:
      tasks: https://olymp.hse.ru/astronomy-tasks/

task_analysis_prompt: |
  При анализе олимпиадных задач выполнить:
  1. Определить точный источник (олимпиада, этап, год, класс)
  2. Классифицировать по типам
  3. Выявить темы:
  4. Извлечь ключевые формулы и методы решения
  5. Оценить сложность
  6. Найти аналогичные задачи
  7. Сгенерировать рекомендации по подготовке
