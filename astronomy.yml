tasks:
  - name: собрать список олимпиад по астрономии
  - name: извлечь задачи прошлых лет
  - name: извлечь обзоры олимпиад и разборы решений олимпиад прошлых лет
  - name: классификация задач
    children:
      - name: классы задач
        children:
          - name: извлечь алгоритмы решений по классам, оценить сложность изучения алгоритмов по классу, сгенерировать план освоения с оценкой трудозатрат, с метриками оценки прогресса исполнения плана
      - name: области знаний
        children:
          - name: подготовить датасет вопросов по каждой из тем/областей знаний
          - name: оценить сложности тем, сгенерировать план освоения с оценкой трудозатрат и учетом порядка изучения тем (зависимые темы ставятся после), извлечь способы и инструменты автоматизированной проверки усвоенных знаний, метрики оценки прогресса исполнения плана
