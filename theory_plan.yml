  - name: Солнечная система
    weight: 200
    subsections:
      - name: Структура
        weight: 80
        components:
          - name: Солнце
            weight: 30
            literature: ["Физика Солнца (А.Б. Северный)", "Солнечная активность (В.Н. Обридко)"]
          
          - name: Планеты
            weight: 30
            literature: ["Планеты земной группы (Б.Ю. Левин)", "Гиганты Солнечной системы (Д. Тримбл)"]
          
          - name: Малые тела
            weight: 20
            literature: ["Астероиды (Э.М. Дробышев)", "Кометы (Ф. Уиппл)"]

      - name: Происхождение
        weight: 60
        literature:
