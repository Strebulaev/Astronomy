      - name: Эволюция
        weight: 60
        literature:
          - "Эволюция Солнечной системы (Дж. Уиздом)"
          - "Будущее Солнечной системы (К.Дж. Лэнг)"
        description: Развитие Солнечной системы

  - name: Галактика Млечный Путь
    weight: 180
    subsections:
