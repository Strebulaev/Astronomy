          - "Математические методы (А.Н. Тихонов)"

      - name: Космические миссии
        weight: 15
        literature:
          - "Космическая астрономия (Р.З. Сагдеев)"
          - "Автоматические станции (Б.М. Панкратов)"

  - name: Практическая астрономия
    weight: 50
    subsections:
      - name: Наблюдения
        weight: 20
        literature:
          - "Астрономические наблюдения (М.М. Дагаев)"
          - "Любительская астрономия (А.А. Гурштейн)"

      - name: Астрофотография
        weight: 15
        literature:
          - "Фотографирование неба (В.Г. Кордюков)"
          - "Цифровая астрофотография (Д.В. Маланов)"

