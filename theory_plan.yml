            weight: 30
            literature: ["Спиральная структура (Ю.Н. Ефремов)", "Звёздные скопления (Б.В. Кукаркин)"]
          
          - name: Гало
            weight: 20
            literature: ["Галактическое гало (П.Н. Холопов)", "Тёмная материя (В.Л. Гинзбург)"]

