      - name: Эволюция
        weight: 50
        literature:
          - "Эволюция галактик (Б.А. Воронцов-Вельяминов)"
          - "Динамика звёздных систем (А.Г. Морозов)"
        description: Развитие галактики

  - name: Вселенная
    weight: 200
    subsections:
      - name: Крупномасштабная структура
        weight: 70
        literature:
          - "Крупномасштабная структура Вселенной (Я.Б. Зельдович)"
          - "Сверхскопления галактик (М.Дж. Геллер)"

      - name: Космологические теории
        weight: 70
        literature:
          - "Теория Большого взрыва (С. Хокинг)"
          - "Инфляционная космология (А.Д. Линде)"

      - name: Будущее Вселенной
        weight: 60
        literature:
          - "Термодинамика Вселенной (А.Д. Чернин)"
          - "Космологические сценарии (М.В. Сажин)"
