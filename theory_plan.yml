  - name: Методы исследования
    weight: 50
    subsections:
      - name: Наблюдательные
        weight: 20
        literature:
          - "Астрономические наблюдения (П.Г. Куликовский)"
          - "Современные телескопы (Н.С. Кардашев)"

      - name: Теоретические
        weight: 15
        literature:
