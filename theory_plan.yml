name: Астрономия
description: Полный план изучения астрономии с весовыми коэффициентами и литературой
total_weight: 1000
sections:
  - name: История
    weight: 100
    subsections:
      - name: Космология
        weight: 40
        literature:
          - "История астрономии (А.И. Еремеева)"
          - "Космические мифы древности (Б.А. Воронцов-Вельяминов)"
        description: Развитие представлений о Вселенной
      
      - name: Инструменты
        weight: 30
        literature:
          - "Телескопы и наблюдательные приборы (Ю.Н. Ефремов)"
          - "История астрономической техники (М.Р. Шпольский)"
        description: Эволюция астрономических приборов

      - name: Освоение космоса
        weight: 30
        literature:
          - "Ракеты и люди (Б.Е. Черток)"
          - "История советской космонавтики (А.А. Александров)"
        description: История космических исследований

  - name: Земля
    weight: 120
    subsections:
      - name: Происхождение
        weight: 50
        literature:
          - "Происхождение Земли (О.Ю. Шмидт)"
          - "Планетология (В.С. Сафронов)"
        description: Теории формирования планеты

      - name: Эволюция
        weight: 40
        literature:
          - "Эволюция Земли (Дж. Ф. Кастер)"
          - "Геологическая история Земли (А.Н. Олейников)"
        description: Развитие Земли как небесного тела

      - name: Видимое небо
        weight: 30
        literature:
          - "Практическая астрономия (М.М. Дагаев)"
          - "Небесная сфера (А.В. Засов)"
        description: Наблюдаемые с Земли явления

  - name: Система Земля-Луна
    weight: 100
    subsections:
      - name: Формирование
        weight: 40
        literature:
          - "Происхождение Луны (У.К. Хартман)"
          - "Планетные системы (Д. Стивенсон)"
