<div class="test-creator">
    <h2>Создать тест</h2>
    
    <div class="creator-container">
      <div class="filters">
        <h3>Фильтры</h3>
        
        <div class="filter-group">
          <label>Теги:</label>
          <div class="tags-selector">
            <div *ngFor="let category of tags" class="tag-category">
              <h4>{{ category.theme }}</h4>
              <div class="tag-options">
                <label *ngFor="let tag of category.tags">
                  <input type="checkbox" 
                         [value]="tag" 
                         [(ngModel)]="selectedTags"
                         [checked]="selectedTags.includes(tag)">
                  {{ tag }}
                </label>
              </div>
            </div>
          </div>
        </div>
        
        <div class="filter-group">
          <label>Сложность: {{ difficultyRange[0] }} - {{ difficultyRange[1] }}</label>
          <div class="range-slider">
            <input type="range" min="0" max="100" step="5" 
                   [(ngModel)]="difficultyRange[0]" (input)="applyFilters()">
            <input type="range" min="0" max="100" step="5" 
                   [(ngModel)]="difficultyRange[1]" (input)="applyFilters()">
          </div>
        </div>
        
        <div class="filter-group">
          <label>Количество вопросов:</label>
          <input type="number" min="1" max="50" [(ngModel)]="questionCount">
        </div>
        
        <div class="filter-actions">
          <button (click)="applyFilters()">Применить</button>
          <button (click)="resetFilters()">Сбросить</button>
        </div>
      </div>
      
      <div class="questions-list">
        <h3>Вопросы ({{ filteredQuestions.length }})</h3>
        
        <div *ngIf="filteredQuestions.length === 0" class="no-questions">
          Нет вопросов, соответствующих фильтрам
        </div>
        
        <div *ngFor="let question of filteredQuestions" 
             class="question-item" 
             [class.selected]="isSelected(question)"
             (click)="toggleQuestionSelection(question)">
          <div class="question-text">{{ question.text }}</div>
          <div class="question-meta">
            <span class="difficulty">Сложность: {{ question.difficulty }}/100</span>
            <span class="tags">
              <span *ngFor="let tag of question.tags" class="tag">{{ tag }}</span>
            </span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="actions" *ngIf="selectedQuestions.length > 0">
      <button (click)="startTest()">Начать тест ({{ selectedQuestions.length }})</button>
    </div>
  </div>
