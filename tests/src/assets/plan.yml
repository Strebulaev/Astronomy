    days:
      - day: 1
        topics:
          - "Небесная сфера: основные точки и линии (сложность: 30, время: 2ч)"
          - "Горизонтальная система координат (сложность: 35, время: 2ч)"
          - "Геоцентрическая система Птолемея (II век н.э.) (сложность: 35, время: 2ч)"
          - "Эпициклы и деференты"
          - "Альмагест - основной труд античной астрономии"
      - day: 2
        topics:
          - "Экваториальная система координат (сложность: 40, время: 2.5ч)"
          - "Древние обсерватории: Стоунхендж, Вавилон (сложность: 25, время: 1.5ч)"
          - "Опыт Эратосфена (измерение Земли) (сложность: 30, время: 1.5ч)"
      - day: 3
        topics:
          - "Античная астрономия: Птолемей, Аристарх (сложность: 35, время: 2ч)"
          - "Геоцентрическая система мира (сложность: 40, время: 2ч)"
          - "Гелиоцентрическая система Коперника (1543 г.) (сложность: 45, время: 2ч)"
          - "De Revolutionibus Orbium Coelestium"
          - "Подтверждение Галилеем (фазы Венеры, спутники Юпитера)"
      - day: 4
        topics:
          - "Гелиоцентрическая система Коперника (сложность: 45, время: 2ч)"
          - "Тихо Браге: точные наблюдения (сложность: 30, время: 1.5ч)"
          - "Наблюдения Тихо Браге → законы Кеплера (сложность: 35, время: 2ч)"
      - day: 5
        topics:
          - "Кеплер и его законы (сложность: 50, время: 2.5ч)"
          - "1. Эллиптические орбиты"
          - "2. Равновеликие площади"
