          - "Закон всемирного тяготения"
          - "Вывод законов Кеплера из динамики"
          - "Инструменты астрономии: от Галилея до XIX века (сложность: 40, время: 2ч)"
          - "Рефракторы vs рефлекторы (Галилей, Ньютон, Гершель)"

