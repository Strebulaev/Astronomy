      - text: "Угол между направлением на север и проекцией светила на горизонт (0°–360°)"
        correct: true
      - text: "Расстояние до звезды"
        correct: false
      - text: "Угол между эклиптикой и горизонтом"
        correct: false

  - question: "Как называется круг небесной сферы, параллельный горизонту?"
    options:
      - text: "Альмукантарат"
        correct: true
      - text: "Небесный меридиан"
        correct: false
      - text: "Эклиптика"
        correct: false

  - question: "Что такое кульминация светила?"
