name: "Небесная сфера"
tags: ["небесная-сфера"]
questions:
  - question: "Что такое небесная сфера?"
    options:
      - text: "Воображаемая сфера произвольного радиуса, на которую проецируются все небесные объекты"
        correct: true
      - text: "Реальная оболочка, окружающая Землю и содержащая звезды"
        correct: false
      - text: "Граница Солнечной системы"
        correct: false

  - question: "Как называется большой круг небесной сферы, по которому происходит видимое годичное движение Солнца?"
    options:
      - text: "Эклиптика"
        correct: true
      - text: "Небесный экватор"
        correct: false
      - text: "Горизонт"
        correct: false

  - question: "Какая плоскость образует небесный экватор?"
    options:
      - text: "Плоскость, перпендикулярная оси мира и проходящая через центр Земли"
        correct: true
      - text: "Плоскость орбиты Земли вокруг Солнца"
        correct: false
      - text: "Плоскость, касательная к земной поверхности"
        correct: false

  - question: "Что такое ось мира?"
    options:
      - text: "Воображаемая линия, проходящая через полюса мира и совпадающая с осью вращения Земли"
        correct: true
      - text: "Линия, соединяющая зенит и надир"
        correct: false
      - text: "Линия, вдоль которой движется Солнце по эклиптике"
        correct: false

  - question: "Как называется точка пересечения небесной сферы с продолжением оси вращения Земли в северном направлении?"
    options:
      - text: "Северный полюс мира"
        correct: true
      - text: "Зенит"
        correct: false
      - text: "Северный полюс эклиптики"
        correct: false

  - question: "Что такое зенит?"
    options:
      - text: "Точка небесной сферы, находящаяся прямо над наблюдателем"
        correct: true
      - text: "Самая яркая звезда на небе"
        correct: false
      - text: "Точка пересечения эклиптики и небесного экватора"
        correct: false

  - question: "Как называется угол между плоскостью небесного экватора и эклиптикой?"
    options:
      - text: "Наклон эклиптики (~23.5°)"
        correct: true
      - text: "Угловое расстояние до звезды"
        correct: false
      - text: "Широта наблюдателя"
        correct: false

  - question: "Что такое склонение (δ) в экваториальной системе координат?"
    options:
      - text: "Угловое расстояние светила от небесного экватора (от -90° до +90°)"
        correct: true
      - text: "Угол между меридианом светила и точкой весеннего равноденствия"
        correct: false
      - text: "Расстояние до звезды в парсеках"
        correct: false

  - question: "Как называется точка пересечения эклиптики и небесного экватора, в которой Солнце переходит из южного полушария в северное?"
    options:
      - text: "Точка весеннего равноденствия (♈)"
        correct: true
      - text: "Точка летнего солнцестояния (♋)"
        correct: false
      - text: "Апекс Солнца"
        correct: false

  - question: "Что такое прямое восхождение (α)?"
    options:
      - text: "Угловое расстояние вдоль небесного экватора от точки весеннего равноденствия (0h – 24h)"
        correct: true
      - text: "Высота светила над горизонтом"
        correct: false
      - text: "Время восхода звезды"
        correct: false

