  explanation: "Пульсары излучают за счет синхротронного механизма и криволинейного движения заряженных частиц в сильном магнитном поле нейтронной звезды."

- id: 7f6e5d4c-3b2a-1f0g-9h8i-7j6k5l4m3n2o
