  explanation: "Критическая плотность - это плотность материи и энергии, при которой Вселенная является плоской (Ω=1), примерно 9×10^-27 кг/м³ для современной постоянной Хаббла."

- id: 6ba7b82a-9dad-11d1-80b4-00c04fd430c0
