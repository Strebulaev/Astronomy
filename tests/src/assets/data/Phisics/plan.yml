plan:
  name: "План повторения тем по физике за 10 класс для входного контроля в 11 классе"
  total_topics: 35
  schedule:
    - week: 1
      days:
        - day: 1
          topics:
            - "Кинематика: Основные понятия (путь, перемещение, скорость) (сложность: 20, время: 25 мин)"
            - "Кинематика: Равномерное прямолинейное движение (сложность: 25, время: 30 мин)"
            - "Кинематика: Равноускоренное движение (ускорение, формулы) (сложность: 30, время: 35 мин)"
            - "Кинематика: Свободное падение тел (сложность: 25, время: 30 мин)"
            - "Кинематика: Движение по окружности (период, частота, центростр. ускорение) (сложность: 35, время: 40 мин)"

        - day: 2
          topics:
            - "Динамика: Законы Ньютона (формулировки и примеры) (сложность: 30, время: 40 мин)"
            - "Динамика: Силы в природе (сила тяжести, вес, реакция опоры) (сложность: 35, время: 45 мин)"
            - "Динамика: Сила упругости. Закон Гука (сложность: 30, время: 35 мин)"
            - "Динамика: Сила трения (виды, формула) (сложность: 30, время: 35 мин)"
            - "Динамика: Закон всемирного тяготения (сложность: 35, время: 40 мин)"

        - day: 3
          topics:
            - "Законы сохранения: Импульс тела (сложность: 25, время: 30 мин)"
            - "Законы сохранения: Закон сохранения импульса (сложность: 40, время: 50 мин)"
            - "Законы сохранения: Механическая работа и мощность (сложность: 30, время: 35 мин)"
            - "Законы сохранения: Кинетическая энергия (сложность: 25, время: 30 мин)"
            - "Законы сохранения: Потенциальная энергия (сложность: 30, время: 35 мин)"
            - "Законы сохранения: Закон сохранения механической энергии (сложность: 45, время: 55 мин)"

        - day: 4
          topics:
            - "Статика: Момент силы (сложность: 40, время: 45 мин)"
            - "Статика: Условия равновесия тел (сложность: 45, время: 50 мин)"
            - "МКТ: Основные положения МКТ (сложность: 20, время: 25 мин)"
            - "МКТ: Идеальный газ. Основное уравнение МКТ (сложность: 50, время: 60 мин)"
            - "МКТ: Температура. Абсолютная температура (сложность: 25, время: 30 мин)"

        - day: 5
          topics:
            - "Термодинамика: Уравнение состояния идеального газа (Уравнение Менделеева-Клапейрона) (сложность: 55, время: 65 мин)"
            - "Термодинамика: Изопроцессы (Изотермический, изохорный, изобарный) (сложность: 50, время: 60 мин)"
            - "Термодинамика: Внутренняя энергия (сложность: 30, время: 35 мин)"
            - "Термодинамика: Первый закон термодинамики (сложность: 60, время: 70 мин)"
            - "Термодинамика: Применение первого закона к изопроцессам (сложность: 65, время: 75 мин)"

        - day: 6
          topics:
            - "Электродинамика: Электрический заряд. Закон сохранения заряда (сложность: 25, время: 30 мин)"
            - "Электродинамика: Закон Кулона (сложность: 35, время: 40 мин)"
            - "Электродинамика: Электрическое поле. Напряженность (сложность: 45, время: 50 мин)"
            - "Электродинамика: Работа поля. Потенциал и напряжение (сложность: 60, время: 70 мин)"
            - "Электродинамика: Конденсаторы. Электроемкость. Энергия конденсатора (сложность: 50, время: 60 мин)"

        - day: 7
          topics:
            - "Законы постоянного тока: Сила тока. Напряжение. Сопротивление (Закон Ома для участка цепи) (сложность: 40, время: 45 мин)"
            - "Законы постоянного тока: Последовательное и параллельное соединение проводников (сложность: 45, время: 50 мин)"
            - "Законы постоянного тока: Работа и мощность тока. Закон Джоуля-Ленца (сложность: 35, время: 40 мин)"
            - "Законы постоянного тока: ЭДС. Закон Ома для полной цепи (сложность: 55, время: 65 мин)"
            - "Решаем типовые задачи на все темы (сложность: 70, время: 90 мин)"