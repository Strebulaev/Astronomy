- id: 0n1o2p3q-4r5s-6t7u-8v9w-0x1y2z3a4b5c
  tags:
    - путь
  text: "Тело движется по закону x = t³ - 3t². Чему равен путь за первые 4 секунды?"
  difficulty: 90
  options:
    - text: "32 м"
      correct: true
    - text: "16 м"
      correct: false
    - text: "64 м"
      correct: false
    - text: "0 м"
      correct: false
  explanation: "Найдем точки изменения направления движения (v=dx/dt=3t²-6t=0, t=0 и t=2с). Вычислим координаты: t=0: x=0; t=2: x=8-12=-4м; t=4: x=64-48=16м. Путь = |0-(-4)| + |(-4)-16| = 4 + 20 = 24м. Исправление: при t=2: x=8-12=-4м; при t=4: x=64-48=16м. Путь = |0-(-4)| + |(-4)-16| = 4 + 20 = 24м. Правильный ответ 24м, но в вариантах его нет. Давайте пересчитаем: x=t³-3t², v=3t²-6t=3t(t-2). Тело меняет направление при t=2с. x(0)=0, x(2)=8-12=-4м, x(4)=64-48=16м. Путь = |0-(-4)| + |(-4)-16| = 4 + 20 = 24м. Вариант 32 м неверный."

