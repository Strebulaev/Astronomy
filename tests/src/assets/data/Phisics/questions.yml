- id: 0j1k2l3m-4n5o-6p7q-8r9s-0t1u2v3w4x5y
  tags:
    - путь
  text: "Тело двигалось 2 ч со скоростью 60 км/ч, затем 3 ч со скоростью 50 км/ч. Найдите весь пройденный путь."
  difficulty: 50
  options:
    - text: "270 км"
